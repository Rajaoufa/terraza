<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Esencia</title>
<meta name="theme-color" content="#1E4A3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Terraza: letra grande, botones enormes, alto contraste. Verde botella + azafrán. */
:root{
  --bg:#F3F5F1; --card:#FFFFFF; --ink:#16241F; --muted:#56655F; --line:#D8DFDA; --soft:#E8EEEA;
  --brand:#1E4A3D; --brand-ink:#FFFFFF; --link:#1E4A3D; --accent:#E3A12F; --accent-ink:#2A1C00;
  --ok:#2E7D4F; --ok-soft:#DDF1E4; --alert:#C2412B; --alert-soft:#FBE3DE; --warn-soft:#FCEFD3;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A16; --card:#17251F; --ink:#EEF3EF; --muted:#A4B3AC; --line:#2A3B34; --soft:#1E2F28;
  --brand:#2F6B58; --brand-ink:#FFFFFF; --link:#F0B54A; --accent:#F0B54A; --accent-ink:#2A1C00;
  --ok:#5BBE85; --ok-soft:#173A27; --alert:#F07A62; --alert-soft:#40211B; --warn-soft:#3A2E14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1A16; --card:#17251F; --ink:#EEF3EF; --muted:#A4B3AC; --line:#2A3B34; --soft:#1E2F28;
  --brand:#2F6B58; --brand-ink:#FFFFFF; --link:#F0B54A; --accent:#F0B54A; --accent-ink:#2A1C00;
  --ok:#5BBE85; --ok-soft:#173A27; --alert:#F07A62; --alert-soft:#40211B; --warn-soft:#3A2E14; color-scheme:dark;
}
.prev{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--ink);color:var(--bg);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));font-size:.8em}
.prev b{margin-right:4px}
.prev button{border:1px solid var(--bg);background:transparent;color:var(--bg);border-radius:999px;padding:5px 12px;font-weight:700}
.prev button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
html.big{--fs:22px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
[hidden]{display:none!important}

/* cabecera */
.top{background:var(--brand);color:var(--brand-ink)}
.top .wrap{padding-block:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.7em;letter-spacing:-.01em;line-height:1}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:.45em;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:6px}
.hr{display:flex;gap:10px;align-items:center}
.mesa{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:8px 14px;text-align:center;font-weight:700;line-height:1.1}
.mesa b{display:block;font-family:var(--f-display);font-size:1.6em}
.mesa span{font-size:.7em;letter-spacing:.1em;text-transform:uppercase}
.tsize{background:transparent;border:2px solid rgba(255,255,255,.5);color:var(--brand-ink);border-radius:10px;padding:6px 10px;font-weight:700}

/* textos */
.hello{font-family:var(--f-display);font-weight:600;font-size:1.5em;margin:26px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
.nopay{margin-top:22px;padding:14px 16px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.9em}

/* botones grandes */
.big-btns{display:grid;gap:16px}
.bb{display:flex;align-items:center;gap:18px;width:100%;text-align:left;border:0;border-radius:22px;padding:24px 22px;min-height:110px}
.bb svg{flex:none;width:52px;height:52px}
.bb strong{display:block;font-family:var(--f-display);font-size:1.35em;line-height:1.15}
.bb em{font-style:normal;opacity:.85;font-size:.9em}
.bb.call{background:var(--accent);color:var(--accent-ink)}
.bb.menu{background:var(--brand);color:var(--brand-ink)}
.bb:active{transform:scale(.985)}
.bb[disabled]{opacity:.55;cursor:default}

/* estado para el cliente */
.status{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px 16px;margin:18px 0 0;font-weight:700}
.status.wait{background:var(--warn-soft)}
.status.go{background:var(--ok-soft)}
.status .dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--accent)}
.status.go .dot{background:var(--ok)}
.status.wait .dot{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.mine{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.mine h3{font-family:var(--f-display);font-size:1.1em;margin:12px 0 4px}

/* carta */
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:16px 0;font-weight:700;color:var(--link)}
.tabs{display:flex;gap:10px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.tab{flex:1;border:2px solid var(--brand);background:transparent;border-radius:999px;padding:12px;font-weight:700}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.cat h2{font-family:var(--f-display);font-size:1.2em;margin:22px 0 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 16px;margin-bottom:10px}
.item .info{flex:1;min-width:0}
.item .n{font-weight:700}
.item .mk{display:inline-block;font-size:.75em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.item .d{color:var(--muted);font-size:.85em}
.item .p{font-variant-numeric:tabular-nums;font-weight:700;color:var(--link);margin-top:2px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;border-radius:14px;border:0;font-size:1.5em;font-weight:700;line-height:1}
.step .m{background:var(--line)}
.step .a{background:var(--brand);color:var(--brand-ink)}
.step output{min-width:28px;text-align:center;font-weight:700;font-size:1.1em;font-variant-numeric:tabular-nums}
.item.has{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.bar .in{max-width:640px;margin:0 auto}
.cta{width:100%;border:0;border-radius:18px;padding:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cta.c{justify-content:center}
.cta[disabled]{background:var(--line);color:var(--muted)}

/* resumen */
.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:0}
.row.total{font-weight:700;font-size:1.05em}
.row .st{font-size:.8em;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;align-self:center}
.st.env{background:var(--warn-soft)} .st.rec{background:var(--ok-soft)}
label.lbl{display:block;font-weight:700;margin:20px 0 8px}
textarea,.pick input{width:100%;font:inherit;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink)}
textarea{min-height:90px}
.pick input{font-size:1.4em;text-align:center;padding:14px}

/* confirmación */
.done{text-align:center;padding-top:40px}
.done .tick{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.done h2{font-family:var(--f-display);font-size:1.6em;margin:0 0 8px;text-wrap:balance}
.ghost{margin-top:22px;border:2px solid var(--brand);background:transparent;border-radius:16px;padding:14px 22px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:20;max-width:90%;text-align:center}

/* ============ APP CAMAREROS ============ */
body.staff .wrap{max-width:1200px}
.svc{border:0;border-radius:999px;padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:10px;min-height:48px}
.svc i{width:14px;height:14px;border-radius:50%;background:currentColor}
.svc.on{background:var(--ok);color:#fff}
.svc.off{background:rgba(255,255,255,.18);color:var(--brand-ink)}
.ptabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.ptabs .tab{flex:0 1 auto;padding:10px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.mc{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.mc.hot{border-color:var(--alert);box-shadow:0 0 0 2px var(--alert)}
.mc .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 6px}
.mc .h b{font-family:var(--f-display);font-size:1.5em}
.mc .who{padding:0 16px 10px;color:var(--muted);font-size:.9em;overflow-wrap:anywhere}
.t{color:var(--muted);font-size:.85em;font-variant-numeric:tabular-nums}
.ev{margin:0 10px 10px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ev.call{background:var(--warn-soft)}
.ev.ord{background:var(--alert-soft)}
.ev .l{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ev ul{margin:0;padding-left:20px}
.ev .nota{background:var(--card);border-radius:10px;padding:8px 10px;font-size:.9em;overflow-wrap:anywhere}
.act{border:0;border-radius:12px;padding:12px;font-weight:700;min-height:48px}
.act.go{background:var(--accent);color:var(--accent-ink)}
.act.ok{background:var(--ok);color:#fff}
.act.pay{background:var(--brand);color:var(--brand-ink)}
.act.no{background:var(--line)}
.cons{padding:4px 16px 8px;border-top:1px solid var(--line)}
.cons .row{padding:7px 0;font-size:.95em}
.cons .cap{font-size:.75em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:10px}
.foot{padding:10px 16px 16px;display:grid;gap:8px}
.ask{background:var(--soft);border-radius:12px;padding:12px;display:grid;gap:8px}
.ask .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.offbox{text-align:center;padding:60px 0;color:var(--muted)}
.offbox b{display:block;font-family:var(--f-display);font-size:1.6em;color:var(--ink);margin-bottom:8px}
.demo{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:.85em;padding:6px 12px;font-weight:700}
.hist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* QR imprimibles */
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px}
.qrc{background:#fff;color:#16241F;border:2px solid #1E4A3D;border-radius:18px;padding:18px;text-align:center;break-inside:avoid}
.qrc .nm{font-family:var(--f-display);font-weight:800;font-size:1.5em;color:#1E4A3D}
.qrc .q{display:flex;justify-content:center;margin:12px 0}
.qrc .ms{font-weight:700;font-size:1.2em}
.qrc .hint{font-size:.8em;color:#56655F}
@media print{.noprint{display:none!important}body{background:#fff}.wrap{padding:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==========================================================
   CONFIGURACIÓN — cambia solo esto
   ========================================================== */
const CONFIG = {
  NOMBRE: "Esencia",
  SUPABASE_URL: "",          // ej: https://xxxx.supabase.co   (vacío = modo prueba)
  SUPABASE_KEY: "",          // anon public key
  PIN_PANEL: "1234",         // PIN para entrar a la app de camareros
  MESAS: 20                  // nº de mesas para generar los QR
};

/* CARTA DE EJEMPLO — pon aquí la carta real de Esencia (m = marca) */
const CARTA = [
  { cat: "Bebidas", grupos: [
    { g:"Cervezas", items:[
      { id:"b1", n:"Caña", m:"Estrella Damm", p:2.20 },
      { id:"b2", n:"Doble", m:"Estrella Damm", p:3.50 },
      { id:"b3", n:"Botellín", m:"Voll-Damm", p:3.00 },
      { id:"b4", n:"Sin alcohol", m:"Free Damm", p:2.80 }
    ]},
    { g:"Refrescos y agua", items:[
      { id:"b5", n:"Cola", m:"Coca-Cola", p:2.50 },
      { id:"b6", n:"Cola Zero", m:"Coca-Cola", p:2.50 },
      { id:"b7", n:"Naranja", m:"Fanta", p:2.50 },
      { id:"b8", n:"Limón", m:"Fanta", p:2.50 },
      { id:"b9", n:"Tónica", m:"Schweppes", p:2.50 },
      { id:"b10", n:"Agua 50 cl", m:"Font Vella", p:1.80 }
    ]},
    { g:"Vinos y vermut", items:[
      { id:"b11", n:"Copa tinto", m:"Rioja crianza", p:3.00 },
      { id:"b12", n:"Copa blanco", m:"Verdejo", p:3.00 },
      { id:"b13", n:"Vermut", m:"Yzaguirre", d:"Con oliva y naranja", p:3.50 }
    ]},
    { g:"Cafés", items:[
      { id:"b14", n:"Café solo", m:"Marcilla", p:1.40 },
      { id:"b15", n:"Cortado", m:"Marcilla", p:1.50 },
      { id:"b16", n:"Café con leche", m:"Marcilla", p:1.70 }
    ]}
  ]},
  { cat: "Comidas", grupos: [
    { g:"Tapas", items:[
      { id:"c1", n:"Patatas bravas", p:5.50 },
      { id:"c2", n:"Croquetas caseras", d:"6 unidades", p:7.00 },
      { id:"c3", n:"Calamares a la romana", p:9.50 },
      { id:"c4", n:"Pan con tomate", p:2.50 }
    ]},
    { g:"Raciones y bocadillos", items:[
      { id:"c5", n:"Tabla de embutidos", p:12.00 },
      { id:"c6", n:"Tortilla de patatas", d:"Ración", p:6.50 },
      { id:"c7", n:"Bocadillo de lomo con queso", p:6.00 },
      { id:"c8", n:"Ensalada de la casa", p:8.00 }
    ]}
  ]}
];

/* ========================================================== */
const $app = document.getElementById("app");
const qs = new URLSearchParams(location.search);
// también vale #panel, #qr o #mesa5 al final del enlace
{ const h = location.hash.slice(1); if (h==="panel"||h==="qr") qs.set(h,""); else if (/^mesa[0-9A-Za-z-]+$/.test(h)) qs.set("mesa", h.slice(4)); }
const PREVIEW = !!window.ESENCIA_PREVIEW;
if (PREVIEW) { try{ localStorage.setItem("esencia_pin_ok", JSON.stringify("1234")); }catch{} if (!qs.has("panel")&&!qs.has("qr")&&!qs.get("mesa")) qs.set("mesa","5"); }
const eur = n => (Number(n)||0).toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };
const ALL_ITEMS = CARTA.flatMap(c=>c.grupos.flatMap(g=>g.items));
const findItem = id => ALL_ITEMS.find(i=>i.id===id);
const label = i => i.m ? `${i.n} · ${i.m}` : i.n;
const hora = iso => new Date(iso).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
const hace = iso => { const m = Math.floor((Date.now()-new Date(iso))/60000); return m<1?"ahora":m<60?`hace ${m} min`:hora(iso); };
const ICON = {
  bell:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`,
  menu:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h13a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`,
  back:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  tick:`<svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`
};
if (ls.get("esencia_big", false)) document.documentElement.classList.add("big");
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }

/* ---------- Almacén: Supabase o modo prueba (mismo navegador) ---------- */
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY;
const sb = !DEMO && window.supabase ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY) : null;
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("esencia") : null;
const T = "esencia_pedidos";
const demoAll = () => ls.get("esencia_demo", []);
const demoSave = a => { ls.set("esencia_demo", a); bc && bc.postMessage("x"); };
const Store = {
  async add(rec){
    if (sb){ const {data,error} = await sb.from(T).insert(rec).select().single(); if (error) throw error; return data; }
    const row = {...rec, id: Date.now(), created_at: new Date().toISOString(), estado:"nuevo", cerrado:false};
    demoSave([...demoAll(), row]); return row;
  },
  async list(){ // todo lo de las últimas 16 h (abiertas + cerradas hoy)
    const desde = new Date(Date.now()-16*3600e3).toISOString();
    if (sb){ const {data,error} = await sb.from(T).select("*").gte("created_at",desde).order("created_at"); if (error) throw error; return data; }
    return demoAll().filter(r=>r.created_at>=desde);
  },
  async byIds(ids){
    if (!ids.length) return [];
    if (sb){ const {data,error} = await sb.from(T).select("*").in("id",ids); if (error) throw error; return data; }
    return demoAll().filter(r=>ids.includes(r.id));
  },
  async accept(id){
    const patch = {estado:"aceptado", aceptado_at:new Date().toISOString()};
    if (sb){ const {error} = await sb.from(T).update(patch).eq("id",id); if (error) throw error; return; }
    demoSave(demoAll().map(r=>r.id===id?{...r,...patch}:r));
  },
  async closeMesa(mesa){
    const patch = {cerrado:true, cerrado_at:new Date().toISOString(), estado:"aceptado"};
    if (sb){ const {error} = await sb.from(T).update(patch).eq("mesa",mesa).eq("cerrado",false); if (error) throw error; return; }
    demoSave(demoAll().map(r=>r.mesa===mesa&&!r.cerrado?{...r,...patch}:r));
  },
  subscribe(cb, cada=15000){
    if (sb){ sb.channel("esencia-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:T}, ()=>cb()).subscribe(); }
    else { bc && bc.addEventListener("message", ()=>cb()); addEventListener("storage", e=>e.key==="esencia_demo"&&cb()); }
    setInterval(cb, cada); // por si se corta la conexión
  }
};

/* ================= CLIENTE ================= */
const mesa = (qs.get("mesa") || "").replace(/[^0-9A-Za-z-]/g,"").slice(0,6);
const KEY = "esencia_cli_"+mesa;
let yo = ls.get(KEY, {nombre:"", ids:[]});  // nombre del cliente + ids de sus peticiones abiertas
let misFilas = [];
let cesta = {};
let vista = yo.nombre ? "inicio" : "nombre";
let catSel = CARTA[0].cat;
const guardaYo = () => ls.set(KEY, yo);
const totalUds = () => Object.values(cesta).reduce((a,b)=>a+b,0);
const totalEur = () => Object.entries(cesta).reduce((a,[id,q])=>a+findItem(id).p*q,0);

function header(){
  return `<header class="top"><div class="wrap">
    <div class="logo">${esc(CONFIG.NOMBRE)}<small>Terraza</small></div>
    <div class="hr"><button class="tsize" id="tsize" aria-label="Cambiar tamaño de letra">A+</button>
      ${mesa?`<div class="mesa"><span>Mesa</span><b>${esc(mesa)}</b></div>`:""}</div></div></header>`;
}
function bindHeader(){ const b=document.getElementById("tsize"); if(b) b.onclick=()=>{ ls.set("esencia_big", document.documentElement.classList.toggle("big")); }; }

async function refrescaMias(){
  if (!mesa || !yo.ids.length) { misFilas = []; return; }
  try { misFilas = await Store.byIds(yo.ids); } catch { return; }
  if (misFilas.length && misFilas.every(r=>r.cerrado)) {        // la barra ha cobrado y cerrado la mesa
    yo.ids = []; guardaYo(); misFilas = [];
    if (["inicio","enviado","avisado"].includes(vista)) { vista = "cerrada"; }
  }
  if (["inicio","enviado","avisado","cerrada"].includes(vista)) cliente();
}
function llamadaActual(){
  const c = misFilas.filter(r=>r.tipo==="camarero"&&!r.cerrado).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];
  if (!c) return null;
  if (c.estado==="nuevo") return "espera";
  if (c.aceptado_at && Date.now()-new Date(c.aceptado_at) < 5*60e3) return "viene";
  return null;
}
function bloqueEstado(){
  const s = llamadaActual();
  if (s==="espera") return `<div class="status wait" role="status"><span class="dot"></span>Camarero avisado. Esperando a que lo vea…</div>`;
  if (s==="viene")  return `<div class="status go" role="status"><span class="dot"></span>El camarero va hacia tu mesa.</div>`;
  return "";
}
function bloqueMios(){
  const peds = misFilas.filter(r=>r.tipo==="pedido"&&!r.cerrado);
  if (!peds.length) return "";
  const tot = peds.reduce((a,r)=>a+Number(r.total||0),0);
  return `<div class="mine"><h3>Lo que llevas pedido</h3>${peds.map(r=>`
    <div class="row"><span>${(r.items||[]).map(i=>`${Number(i.q)||0}× ${esc(i.n)}`).join(", ")}</span>
    <span class="st ${r.estado==="nuevo"?"env":"rec"}">${r.estado==="nuevo"?"Enviado":"Recibido"}</span></div>`).join("")}
    <div class="row total"><span>Total aproximado</span><span>${eur(tot)}</span></div></div>`;
}

function cliente(){
  if (!mesa){
    $app.innerHTML = header() + `<main class="wrap pick">
      <p class="hello">Bienvenido</p>
      <p class="sub">Escanea el código QR de tu mesa. Si no puedes, escribe aquí el número de la mesa.</p>
      <form id="fm"><input id="nm" inputmode="numeric" placeholder="Nº de mesa" aria-label="Número de mesa" required>
      <button class="cta c" style="margin-top:14px">Continuar</button></form></main>`;
    document.getElementById("fm").onsubmit = e => { e.preventDefault(); const v=document.getElementById("nm").value.trim(); if(v) location.search="?mesa="+encodeURIComponent(v); };
    bindHeader(); return;
  }
  let h = header() + `<main class="wrap">`, barra = "";
  if (vista==="nombre"){
    h += `<div class="pick"><p class="hello">¡Hola! ¿Cómo te llamas?</p>
      <p class="sub">Solo para que el camarero sepa a quién llevarle cada cosa. No hace falta registrarse.</p>
      <form id="fn"><input id="nom" maxlength="30" autocomplete="given-name" placeholder="Tu nombre" aria-label="Tu nombre" value="${esc(yo.nombre)}" required>
      <button class="cta c" style="margin-top:14px">Continuar</button></form></div>`;
  }
  if (vista==="inicio"){
    const s = llamadaActual();
    h += `<p class="hello">Hola, ${esc(yo.nombre)}. ¿Qué necesitas?</p>
      <p class="sub">Toca un botón grande.</p>
      <div class="big-btns">
        <button class="bb call" id="call" ${s==="espera"?"disabled":""}>${ICON.bell}<span><strong>Llamar al camarero</strong><em>${s==="espera"?"Ya le hemos avisado":"Vendrá a tu mesa"}</em></span></button>
        <button class="bb menu" id="carta">${ICON.menu}<span><strong>Ver la carta y pedir</strong><em>Bebidas y comidas</em></span></button>
      </div>${bloqueEstado()}${bloqueMios()}
      <p class="nopay">No pagas aquí. Pagas al final, como siempre, con el camarero.</p>
      <button class="back" id="cambiaNom">No soy ${esc(yo.nombre)}, cambiar nombre</button>`;
  }
  if (vista==="carta"){
    h += `<button class="back" id="volver">${ICON.back} Volver</button>
      <div class="tabs" role="tablist">${CARTA.map(c=>`<button class="tab" role="tab" data-cat="${esc(c.cat)}" aria-selected="${c.cat===catSel}">${esc(c.cat)}</button>`).join("")}</div>`;
    const c = CARTA.find(c=>c.cat===catSel);
    h += c.grupos.map(g=>`<section class="cat"><h2>${esc(g.g)}</h2>${g.items.map(i=>{
      const q = cesta[i.id]||0;
      return `<div class="item ${q?"has":""}"><div class="info">${i.m?`<span class="mk">${esc(i.m)}</span>`:""}<div class="n">${esc(i.n)}</div>${i.d?`<div class="d">${esc(i.d)}</div>`:""}<div class="p">${eur(i.p)}</div></div>
        <div class="step">${q?`<button class="m" data-m="${i.id}" aria-label="Quitar uno de ${esc(label(i))}">−</button><output>${q}</output>`:""}
        <button class="a" data-a="${i.id}" aria-label="Añadir ${esc(label(i))}">+</button></div></div>`;
    }).join("")}</section>`).join("");
    barra = `<button class="cta" id="verPedido" ${totalUds()?"":"disabled"}><span>${totalUds()?`Ver mi pedido (${totalUds()})`:"Elige lo que quieras"}</span><span>${totalUds()?eur(totalEur()):""}</span></button>`;
  }
  if (vista==="resumen"){
    h += `<button class="back" id="volverCarta">${ICON.back} Seguir pidiendo</button>
      <p class="hello" style="margin-top:4px">Tu pedido, ${esc(yo.nombre)}</p>
      <div class="sum">${Object.entries(cesta).map(([id,q])=>{const i=findItem(id);return `<div class="row"><span>${q} × ${esc(label(i))}</span><span>${eur(i.p*q)}</span></div>`}).join("")}
      <div class="row total"><span>Total aproximado</span><span>${eur(totalEur())}</span></div></div>
      <label class="lbl" for="nota">¿Algo que debamos saber? (opcional)</label>
      <textarea id="nota" maxlength="200" placeholder="Ej: sin hielo, sin gluten, la caña muy fría…">${esc(ls.get("esencia_nota",""))}</textarea>
      <p class="nopay">No pagas ahora. Pagas al final con el camarero.</p>`;
    barra = `<button class="cta c" id="enviar">Enviar pedido</button>`;
  }
  if (vista==="enviado" || vista==="avisado" || vista==="cerrada"){
    const txt = {
      enviado:["¡Pedido enviado!", `Te lo llevamos a la mesa ${esc(mesa)}.`],
      avisado:["Camarero avisado", `Te avisamos aquí cuando venga hacia la mesa ${esc(mesa)}.`],
      cerrada:["Cuenta cerrada", "Gracias por venir a "+esc(CONFIG.NOMBRE)+". ¡Hasta pronto!"]
    }[vista];
    h += `<div class="done"><div class="tick">${ICON.tick}</div><h2>${txt[0]}</h2><p class="sub">${txt[1]}</p>
      ${vista==="avisado"?bloqueEstado():""}
      <button class="ghost" id="inicio">Volver al inicio</button></div>`;
  }
  h += `</main>`;
  if (barra) h += `<div class="bar"><div class="in">${barra}</div></div>`;
  $app.innerHTML = h; bindHeader(); bindCliente();
}
function go(v){ vista=v; cliente(); scrollTo(0,0); }

function bindCliente(){
  const on = (id,fn) => { const el=document.getElementById(id); if(el) el.onclick=fn; };
  const fn = document.getElementById("fn");
  if (fn) fn.onsubmit = e => { e.preventDefault(); const v=document.getElementById("nom").value.trim().slice(0,30); if(!v) return; yo.nombre=v; guardaYo(); go("inicio"); };
  on("cambiaNom", ()=>go("nombre"));
  on("carta", ()=>go("carta"));
  on("volver", ()=>go("inicio"));
  on("volverCarta", ()=>{ saveNota(); go("carta"); });
  on("verPedido", ()=>go("resumen"));
  on("inicio", ()=>go("inicio"));
  on("call", async e => {
    e.currentTarget.disabled = true;
    try { const r = await Store.add({mesa, tipo:"camarero", cliente:yo.nombre});
          yo.ids.push(r.id); guardaYo(); misFilas.push(r); go("avisado"); }
    catch { e.currentTarget.disabled=false; toast("No se ha podido avisar. Revisa la conexión y prueba otra vez."); }
  });
  on("enviar", async e => {
    const btn=e.currentTarget; btn.disabled=true; btn.textContent="Enviando…";
    const items = Object.entries(cesta).map(([id,q])=>{const i=findItem(id);return {n:label(i),q,p:i.p}});
    const nota = (document.getElementById("nota")?.value||"").trim().slice(0,200);
    try { const r = await Store.add({mesa, tipo:"pedido", cliente:yo.nombre, items, nota, total:Math.round(totalEur()*100)/100});
          yo.ids.push(r.id); guardaYo(); misFilas.push(r); cesta={}; ls.set("esencia_nota",""); go("enviado"); }
    catch { btn.disabled=false; btn.textContent="Enviar pedido"; toast("No se ha enviado. Revisa la conexión y prueba otra vez."); }
  });
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{catSel=b.dataset.cat;cliente()});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const id=b.dataset.a;cesta[id]=(cesta[id]||0)+1;cliente()});
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const id=b.dataset.m;cesta[id]--; if(cesta[id]<=0) delete cesta[id]; cliente()});
}
function saveNota(){ const n=document.getElementById("nota"); if(n) ls.set("esencia_nota", n.value); }

/* ================= APP CAMAREROS ================= */
let enServicio = ls.get("esencia_servicio", false);
let pestana = "abiertas", filas = [], vistos = null, cobrando = null, audioCtx = null, wake = null;

function sonar(tipo){
  if (!enServicio) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const notas = tipo==="camarero" ? [[660,0],[880,.22]] : [[988,0],[988,.16],[1318,.32]];
    notas.forEach(([f,t])=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="triangle"; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      const s=audioCtx.currentTime+t; g.gain.setValueAtTime(.35,s); g.gain.exponentialRampToValueAtTime(.001,s+.2); o.start(s); o.stop(s+.21); });
    navigator.vibrate && navigator.vibrate(tipo==="camarero"?[200,100,200]:[120,80,120,80,120]);
  } catch {}
}
async function pantallaEncendida(on){
  try { if (on && "wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); else if (wake) { await wake.release(); wake=null; } } catch {}
}
// los navegadores solo dejan sonar tras tocar la pantalla: el primer toque desbloquea el audio
document.addEventListener("pointerdown", ()=>{ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch{} }, {once:true});
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && enServicio && qs.has("panel")) pantallaEncendida(true); });

function panel(){
  document.body.classList.add("staff");
  if (ls.get("esencia_pin_ok","") !== CONFIG.PIN_PANEL){
    $app.innerHTML = `<header class="top"><div class="wrap"><div class="logo">${esc(CONFIG.NOMBRE)}<small>Camareros</small></div></div></header>
      <main class="wrap pick" style="max-width:420px"><p class="hello">Introduce el PIN</p>
      <form id="pf"><input id="pin" type="password" inputmode="numeric" aria-label="PIN" required>
      <button class="cta c" style="margin-top:14px">Entrar</button></form></main>`;
    document.getElementById("pf").onsubmit = e => { e.preventDefault();
      if (document.getElementById("pin").value===CONFIG.PIN_PANEL){ ls.set("esencia_pin_ok",CONFIG.PIN_PANEL); panel(); pintar(); } else toast("PIN incorrecto"); };
    return;
  }
  $app.innerHTML = (DEMO?`<div class="demo">MODO PRUEBA · Solo funciona en este navegador. Pon los datos de Supabase para usarlo de verdad.</div>`:"") +
    `<header class="top"><div class="wrap"><div class="logo">${esc(CONFIG.NOMBRE)}<small>Camareros</small></div>
     <button class="svc ${enServicio?"on":"off"}" id="svc" aria-pressed="${enServicio}"><i></i>${enServicio?"En servicio":"Fuera de servicio"}</button></div></header>
     <main class="wrap" id="cuerpo"></main>`;
  document.getElementById("svc").onclick = () => {
    enServicio = !enServicio; ls.set("esencia_servicio", enServicio);
    pantallaEncendida(enServicio);
    if (enServicio){ vistos = null; sonar("pedido"); toast("En servicio. Te avisaremos con sonido."); } else toast("Fuera de servicio. No sonará nada.");
    panel(); pintar();
  };
}

async function pintar(){
  const cuerpo = document.getElementById("cuerpo"); if (!cuerpo) return;
  if (!enServicio){
    cuerpo.innerHTML = `<div class="offbox"><b>Fuera de servicio</b>No recibes avisos ni sonidos.<br>Pulsa “Fuera de servicio” arriba cuando empieces a trabajar.</div>`;
    return;
  }
  try { filas = await Store.list(); } catch { toast("Sin conexión con el servidor"); return; }
  // sonido solo para lo nuevo que no habíamos visto
  const nuevos = filas.filter(r=>r.estado==="nuevo"&&!r.cerrado);
  if (vistos){ const n = nuevos.filter(r=>!vistos.has(r.id));
    if (n.some(r=>r.tipo==="camarero")) sonar("camarero"); else if (n.length) sonar("pedido"); }
  vistos = new Set(nuevos.map(r=>r.id));
  document.title = nuevos.length ? `(${nuevos.length}) ${CONFIG.NOMBRE}` : CONFIG.NOMBRE;

  const abiertas = {};
  filas.filter(r=>!r.cerrado).forEach(r=>{ (abiertas[r.mesa] = abiertas[r.mesa]||[]).push(r); });
  const mesasAb = Object.keys(abiertas).sort((a,b)=>{
    const ha = abiertas[a].some(r=>r.estado==="nuevo"), hb = abiertas[b].some(r=>r.estado==="nuevo");
    return ha!==hb ? (ha?-1:1) : a.localeCompare(b,"es",{numeric:true});
  });
  const cerradas = {};
  filas.filter(r=>r.cerrado).forEach(r=>{ const k=r.mesa+"|"+r.cerrado_at; (cerradas[k]=cerradas[k]||[]).push(r); });
  const listaCerr = Object.entries(cerradas).sort((a,b)=>b[0].split("|")[1].localeCompare(a[0].split("|")[1]));

  let h = `<div class="ptabs">
    <button class="tab" data-p="abiertas" aria-selected="${pestana==="abiertas"}">Mesas abiertas (${mesasAb.length})</button>
    <button class="tab" data-p="cerradas" aria-selected="${pestana==="cerradas"}">Cobradas hoy (${listaCerr.length})</button></div>`;

  if (pestana==="abiertas"){
    h += mesasAb.length ? `<div class="grid">${mesasAb.map(m=>tarjetaMesa(m, abiertas[m])).join("")}</div>`
                        : `<p class="empty">No hay mesas con pedidos. Cuando un cliente escanee el QR y pida, aparecerá aquí.</p>`;
  } else {
    h += listaCerr.length ? `<div class="grid">${listaCerr.map(([k,rs])=>{
        const tot = rs.filter(r=>r.tipo==="pedido").reduce((a,r)=>a+Number(r.total||0),0);
        return `<div class="hist"><b>Mesa ${esc(rs[0].mesa)}</b><span class="t">Cobrada a las ${hora(rs[0].cerrado_at)}</span><b style="font-variant-numeric:tabular-nums">${eur(tot)}</b></div>`;
      }).join("")}</div>` : `<p class="empty">Aún no se ha cobrado ninguna mesa hoy.</p>`;
  }
  cuerpo.innerHTML = h;

  cuerpo.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pestana=b.dataset.p;pintar()});
  cuerpo.querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{ b.disabled=true;
    const id = isNaN(b.dataset.acc)?b.dataset.acc:Number(b.dataset.acc);
    try{ await Store.accept(id); pintar(); }catch{ b.disabled=false; toast("No se ha guardado. Prueba otra vez."); } });
  cuerpo.querySelectorAll("[data-cobrar]").forEach(b=>b.onclick=()=>{ cobrando=b.dataset.cobrar; pintar(); });
  cuerpo.querySelectorAll("[data-nocobrar]").forEach(b=>b.onclick=()=>{ cobrando=null; pintar(); });
  cuerpo.querySelectorAll("[data-cerrar]").forEach(b=>b.onclick=async()=>{ b.disabled=true;
    try{ await Store.closeMesa(b.dataset.cerrar); cobrando=null; toast(`Mesa ${b.dataset.cerrar} cobrada y cerrada`); pintar(); }
    catch{ b.disabled=false; toast("No se ha podido cerrar. Prueba otra vez."); } });
}

function tarjetaMesa(m, rs){
  const pend = rs.filter(r=>r.estado==="nuevo");
  const peds = rs.filter(r=>r.tipo==="pedido");
  const nombres = [...new Set(rs.map(r=>r.cliente).filter(Boolean))];
  const total = peds.reduce((a,r)=>a+Number(r.total||0),0);
  const cons = {};
  peds.forEach(r=>(r.items||[]).forEach(i=>{ const k=i.n; cons[k]=cons[k]||{q:0,p:Number(i.p)||0}; cons[k].q+=Number(i.q)||0; }));
  const desde = rs[0]?.created_at;
  return `<article class="mc ${pend.length?"hot":""}">
    <div class="h"><b>Mesa ${esc(m)}</b><span class="t">Abierta ${desde?hora(desde):""}</span></div>
    ${nombres.length?`<div class="who">${nombres.map(esc).join(" · ")}</div>`:""}
    ${pend.map(r=> r.tipo==="camarero"
      ? `<div class="ev call"><div class="l"><span>${esc(r.cliente||"Un cliente")} llama al camarero</span><span class="t">${hace(r.created_at)}</span></div>
         <button class="act go" data-acc="${esc(r.id)}">Voy para allá</button></div>`
      : `<div class="ev ord"><div class="l"><span>Pedido nuevo · ${esc(r.cliente||"")}</span><span class="t">${hace(r.created_at)}</span></div>
         <ul>${(r.items||[]).map(i=>`<li><b>${Number(i.q)||0}×</b> ${esc(i.n)}</li>`).join("")}</ul>
         ${r.nota?`<div class="nota">${esc(r.nota)}</div>`:""}
         <button class="act ok" data-acc="${esc(r.id)}">Recibido</button></div>`).join("")}
    ${Object.keys(cons).length?`<div class="cons"><div class="cap">Consumo de la mesa</div>
      ${Object.entries(cons).map(([n,c])=>`<div class="row"><span>${c.q}× ${esc(n)}</span><span>${eur(c.q*c.p)}</span></div>`).join("")}
      <div class="row total"><span>Total</span><span>${eur(total)}</span></div></div>`:""}
    <div class="foot">${cobrando===m
      ? `<div class="ask"><b>¿Ya está cobrada la mesa ${esc(m)}${total?` (${eur(total)})`:""}?</b>
         <div class="two"><button class="act pay" data-cerrar="${esc(m)}">Sí, cerrar mesa</button><button class="act no" data-nocobrar>No</button></div></div>`
      : `<button class="act pay" data-cobrar="${esc(m)}">Cobrar y cerrar mesa</button>`}</div>
  </article>`;
}

/* ================= QR PARA IMPRIMIR ================= */
function qrs(){
  const base = location.origin + location.pathname;
  $app.innerHTML = `<main class="wrap"><div class="noprint">
    <p class="hello">Códigos QR de las mesas</p>
    <p class="sub">Imprime esta página (Ctrl+P) y pega cada QR en su mesa. Enlace base: <b>${esc(base)}</b></p></div>
    <div class="qrs">${Array.from({length:CONFIG.MESAS},(_,i)=>`<div class="qrc"><div class="nm">${esc(CONFIG.NOMBRE)}</div>
      <div class="q" id="q${i+1}"></div><div class="ms">Mesa ${i+1}</div><div class="hint">Escanea con la cámara del móvil<br>Llama al camarero o pide desde aquí</div></div>`).join("")}</div></main>`;
  for (let i=1;i<=CONFIG.MESAS;i++) if (window.QRCode) new QRCode(document.getElementById("q"+i), {text: base+"?mesa="+i, width:170, height:170, correctLevel: QRCode.CorrectLevel.M});
}

/* ================= ARRANQUE ================= */
if (PREVIEW){
  const actual = qs.has("panel")?"panel":qs.has("qr")?"qr":"mesa5";
  const pv = document.createElement("div"); pv.className="prev";
  pv.innerHTML = `<b>Vista previa</b>${[["mesa5","Cliente · mesa 5"],["panel","Camarero"],["qr","QR"]].map(([k,t])=>`<button data-v="${k}" aria-pressed="${k===actual}">${t}</button>`).join("")}`;
  document.body.prepend(pv);
  pv.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ location.hash=b.dataset.v; location.reload(); });
}
if (qs.has("panel")) { panel(); pintar(); pantallaEncendida(enServicio); Store.subscribe(()=>pintar(), 10000); }
else if (qs.has("qr")) qrs();
else { cliente(); if (mesa){ refrescaMias(); Store.subscribe(()=>refrescaMias(), 8000); } }
</script>
