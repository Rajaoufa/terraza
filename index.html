<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BAR ESSENCIA</title>
<meta name="theme-color" content="#1E4A3D">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAR ESSENCIA">
<script>/* solo el panel de camareros se instala como app; los clientes entran por el QR */
if (/\/camareros\/?$/.test(location.pathname)||/[?&#]panel/.test(location.href)) { const l=document.createElement("link"); l.rel="manifest"; l.href="manifest-panel.webmanifest"; document.head.appendChild(l); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Terraza: letra grande, botones enormes, alto contraste. Verde botella + azafrán. */
/* FONDO: sube una foto llamada fondo.jpg junto a este index.html (o cambia CONFIG.FONDO).
   Si no hay foto, se ve el dibujo fondo-dibujo.svg (Pont del Diable y, debajo, Buenos Aires). */
:root{
  --foto:url("fondo.jpg"); --foto-pos:center 55%;
  --foto-dibujo:url("fondo-dibujo.svg");   /* Pont del Diable y el barrio Buenos Aires */
  --hero:clamp(250px,40vh,400px);
  --bg:#F3F5F1; --card:#FFFFFF; --ink:#16241F; --muted:#56655F; --line:#D8DFDA; --soft:#E8EEEA;
  --brand:#1E4A3D; --brand-ink:#FFFFFF; --link:#1E4A3D; --accent:#E3A12F; --accent-ink:#2A1C00;
  --ok:#2E7D4F; --ok-soft:#DDF1E4; --alert:#C2412B; --alert-soft:#FBE3DE; --warn-soft:#FCEFD3;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A16; --card:#17251F; --ink:#EEF3EF; --muted:#A4B3AC; --line:#2A3B34; --soft:#1E2F28;
  --brand:#2F6B58; --brand-ink:#FFFFFF; --link:#F0B54A; --accent:#F0B54A; --accent-ink:#2A1C00;
  --ok:#5BBE85; --ok-soft:#173A27; --alert:#F07A62; --alert-soft:#40211B; --warn-soft:#3A2E14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1A16; --card:#17251F; --ink:#EEF3EF; --muted:#A4B3AC; --line:#2A3B34; --soft:#1E2F28;
  --brand:#2F6B58; --brand-ink:#FFFFFF; --link:#F0B54A; --accent:#F0B54A; --accent-ink:#2A1C00;
  --ok:#5BBE85; --ok-soft:#173A27; --alert:#F07A62; --alert-soft:#40211B; --warn-soft:#3A2E14; color-scheme:dark;
}
.prev{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--ink);color:var(--bg);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));font-size:.8em}
.prev b{margin-right:4px}
.prev button{border:1px solid var(--bg);background:transparent;color:var(--bg);border-radius:999px;padding:5px 12px;font-weight:700}
.prev button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
html.big{--fs:22px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.45;
  -webkit-tap-highlight-color:transparent;position:relative}
body.compact,body.staff{--hero:170px}

/* foto de Martorell detrás de la cabecera */
.bg{position:absolute;top:0;left:0;right:0;height:calc(var(--hero) + 60px);z-index:0;background-color:#123128;
  background-image:linear-gradient(180deg,rgba(8,24,19,.62) 0,rgba(8,24,19,.15) 42%,rgba(8,24,19,.35) 100%),var(--foto),var(--foto-dibujo);
  background-repeat:no-repeat;background-size:cover,cover,347% auto;
  /* en el móvil el puente cabe entero y el río queda justo encima de la hoja */
  background-position:center,var(--foto-pos),center calc(var(--hero) - 28px - 73.9vw)}
body.plain .bg{display:none}
/* en el ordenador: puente entero arriba y, a los lados de la hoja, los bloques de Buenos Aires (barrio.svg) */
@media (min-width:760px){
  /* el dibujo se escala para que del cielo al río (unidades 200..554) quepa justo encima de la hoja */
  .bg{background-color:transparent;background-size:cover,cover,auto calc((var(--hero) - 28px) * 2.147);background-position:center,var(--foto-pos),center calc((var(--hero) - 28px) * -0.565);
    background-image:linear-gradient(180deg,rgba(8,24,19,.62) 0,rgba(8,24,19,.15) 42%,rgba(8,24,19,0) 100%),var(--foto),var(--foto-dibujo)}
  /* a cada lado de la hoja, los bloques que marcó Jamal, completos */
  body:not(.plain){background:url("barrio.svg") left 12px top calc(var(--hero) + 4px) / calc(50% - 344px) auto no-repeat,
    url("barrio.svg") right 12px top calc(var(--hero) + 4px) / calc(50% - 344px) auto no-repeat,
    linear-gradient(#F6D08A 0,#F6D08A calc(var(--hero) - 40px),#2C4636 0)}
  /* cabecera baja (camareros, carta): el dibujo ocupa todo el ancho y la cabecera crece lo justo para que el puente quepa entero */
  body.compact,body.staff{--hero:max(170px,calc(28px + 10.6vw))}
  body.compact .bg,body.staff .bg{background-size:cover,cover,100% auto;background-position:center,var(--foto-pos),center calc(var(--hero) - 28px - 21.31vw)}
  /* camareros: la hoja es ancha (1200px), los bloques van en el hueco que queda a los lados */
  /* camareros: la hoja solo mide lo que hay dentro (sin cuadro blanco vacío hasta abajo) */
  body:not(.plain){min-height:100vh}
  body.staff main.wrap{min-height:0;border-radius:28px;padding-bottom:20px;margin-bottom:16px}
  /* camareros: el barrio entero de fondo (bajo el puente) y el panel encima, en la zona que marcó Jamal (en lila) */
  body.staff:not(.plain){background:url("barrio.svg") center calc(var(--hero) - 28px)/100% auto no-repeat,
    linear-gradient(#F6D08A 0,#F6D08A calc(var(--hero) - 40px),#2C4636 0);min-height:max(100vh,calc(var(--hero) - 28px + 63.9vw))}
  body.staff:not(.plain) main.wrap{width:39.8vw;max-width:none!important;min-width:520px;margin:calc(14.4vw - 28px) 0 24px max(16px,min(36.7vw,calc(100vw - 536px)));
    box-shadow:0 12px 40px rgba(0,0,0,.35)}
  /* banderas a la derecha, junto al botón de servicio */
  .top .idiomas{margin-left:auto}
}
#app{position:relative;z-index:1}
/* banderas para cambiar de idioma */
.idiomas{display:flex;gap:8px}
.idiomas button{width:38px;height:26px;padding:0;border:2px solid rgba(255,255,255,.5);border-radius:6px;overflow:hidden;background:none;cursor:pointer;opacity:.75;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.idiomas button svg{display:block;width:100%;height:100%}
.idiomas button[aria-pressed="true"]{border-color:#fff;opacity:1}
/* contenido en una hoja clara que sube sobre la foto: se lee bien al sol */
main.wrap{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-28px;position:relative;padding-top:8px;
  min-height:calc(100vh - var(--hero) + 28px);box-shadow:0 -10px 30px rgba(0,0,0,.18)}
#app > main.wrap:first-child{margin-top:0;border-radius:0;box-shadow:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
[hidden]{display:none!important}

/* cabecera */
.top{color:#fff;min-height:var(--hero);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);text-shadow:0 1px 10px rgba(0,0,0,.45)}
.top .wrap{width:100%;padding-block:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .lugar{margin-top:auto;padding-bottom:44px}
.lugar span{display:inline-flex;align-items:center;gap:8px;background:rgba(8,24,19,.55);border-radius:999px;padding:7px 14px 7px 10px;
  font-weight:700;font-size:.85em;text-shadow:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lugar svg{width:18px;height:18px;flex:none;color:var(--accent)}
body.compact .top .lugar,body.staff .top .lugar{display:none}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(1.35em,7vw,1.9em);letter-spacing:-.01em;line-height:1}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:.45em;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:6px}
.hr{display:flex;gap:10px;align-items:center}
.mesa{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:8px 14px;text-align:center;font-weight:700;line-height:1.1;text-shadow:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.mesa b{display:block;font-family:var(--f-display);font-size:1.6em}
.mesa span{font-size:.7em;letter-spacing:.1em;text-transform:uppercase}
.tsize{background:rgba(8,24,19,.45);border:2px solid rgba(255,255,255,.7);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;min-height:48px}

/* textos */
.hello{font-family:var(--f-display);font-weight:600;font-size:1.5em;margin:26px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
.nopay{margin-top:22px;padding:14px 16px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.9em}

/* botones grandes */
.big-btns{display:grid;gap:16px}
.bb{display:flex;align-items:center;gap:18px;width:100%;text-align:left;border:0;border-radius:22px;padding:24px 22px;min-height:110px;box-shadow:0 6px 18px rgba(22,36,31,.16)}
.bb svg{flex:none;width:52px;height:52px}
.bb strong{display:block;font-family:var(--f-display);font-size:1.35em;line-height:1.15}
.bb em{font-style:normal;opacity:.85;font-size:.9em}
.bb.call{background:var(--accent);color:var(--accent-ink)}
.bb.menu{background:var(--brand);color:var(--brand-ink)}
.bb:active{transform:scale(.985)}
.bb[disabled]{opacity:.55;cursor:default}

/* estado para el cliente */
.status{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px 16px;margin:18px 0 0;font-weight:700}
.status.wait{background:var(--warn-soft)}
.status.go{background:var(--ok-soft)}
.status .dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--accent)}
.status.go .dot{background:var(--ok)}
.status.wait .dot{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.mine{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.mine h3{font-family:var(--f-display);font-size:1.1em;margin:12px 0 4px}

/* carta */
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:16px 0;font-weight:700;color:var(--link)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.sw{position:relative}.sw .secc{width:100%}
.subir{position:absolute;top:8px;left:8px;z-index:2;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.55);color:#fff;font-size:1.1em;display:grid;place-items:center;padding:0}
.tile.has{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.tile .pic{position:relative;border:0;background:var(--soft);aspect-ratio:4/3;display:grid;place-items:center;font-size:3.2em;padding:0}
.tile .pic img{width:100%;height:100%;object-fit:cover}
.tile .qb{position:absolute;top:8px;right:8px;background:var(--brand);color:var(--brand-ink);border-radius:999px;min-width:32px;height:32px;display:grid;place-items:center;font-size:.32em}
.tile .tx{padding:10px 12px 4px;flex:1}
.tile .n{font-weight:700;line-height:1.2}
.tile .mk{display:block;font-size:.72em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tile .d{color:var(--muted);font-size:.8em}
.tile .p{font-variant-numeric:tabular-nums;font-weight:700;color:var(--link);margin-top:2px}
.tile .step{justify-content:space-between;padding:6px 10px 10px}
.pic .foto,.secc .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tiles.tres{grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.tres .pic{aspect-ratio:1;font-size:2.8em}
.tiles.tres .tx{padding:8px 8px 2px}.tiles.tres .n{font-size:.9em}.tiles.tres .d,.tiles.tres .mk{display:none}
.tiles.tres .step{padding:4px 6px 8px}
.secciones{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.secc{position:relative;border:0;border-radius:18px;overflow:hidden;aspect-ratio:1;background:var(--soft);display:grid;place-items:center;font-size:3.6em;padding:0;color:inherit}
.secc b{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;font-size:.3em;text-align:left;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));font-family:var(--f-display)}
.cuenta small{display:block;color:var(--muted);font-size:.8em}
.quien{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 0 10px;color:var(--muted);font-size:.9em}
.tab{flex:1;min-height:52px;border:2px solid var(--brand);background:transparent;border-radius:999px;padding:12px;font-weight:700}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.cat h2{font-family:var(--f-display);font-size:1.2em;margin:22px 0 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 16px;margin-bottom:10px}
.item .info{flex:1;min-width:0}
.item .n{font-weight:700}
.item .mk{display:inline-block;font-size:.75em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.item .d{color:var(--muted);font-size:.85em}
.item .p{font-variant-numeric:tabular-nums;font-weight:700;color:var(--link);margin-top:2px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;border-radius:14px;border:0;font-size:1.5em;font-weight:700;line-height:1}
.step .m{background:var(--line)}
.step .a{background:var(--brand);color:var(--brand-ink)}
.step output{min-width:28px;text-align:center;font-weight:700;font-size:1.1em;font-variant-numeric:tabular-nums}
.item.has{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.bar .in{max-width:640px;margin:0 auto}
.cta{width:100%;border:0;border-radius:18px;padding:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cta.c{justify-content:center}
.cta[disabled]{background:var(--line);color:var(--muted)}

/* resumen */
.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:0}
.row.total{font-weight:700;font-size:1.05em}
.row .st{font-size:.8em;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;align-self:center}
.st.env{background:var(--warn-soft)} .st.rec{background:var(--ok-soft)}
label.lbl{display:block;font-weight:700;margin:20px 0 8px}
textarea,.pick input{width:100%;font:inherit;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink)}
textarea{min-height:90px}
.pick input{font-size:1.4em;text-align:center;padding:14px}

/* confirmación */
.done{text-align:center;padding-top:40px}
.done .tick{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.done h2{font-family:var(--f-display);font-size:1.6em;margin:0 0 8px;text-wrap:balance}
.ghost{margin-top:22px;border:2px solid var(--brand);background:transparent;border-radius:16px;padding:14px 22px;font-weight:700}
.inst{display:flex;gap:14px;align-items:flex-start;margin-top:26px;background:var(--card);border:2px solid var(--brand);border-radius:18px;padding:16px}
.inst img{border-radius:14px;flex:none}
.inst b{font-family:var(--f-display);font-size:1.1em}
.inst p{margin:4px 0 10px;color:var(--muted);font-size:.9em}
.inst .act{padding:12px 18px}
.scan{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.scan video{width:min(90vw,420px);aspect-ratio:1;object-fit:cover;border-radius:18px;border:3px solid var(--accent)}
.scan .ghost{color:#fff;border-color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:20;max-width:90%;text-align:center}

/* ============ APP CAMAREROS ============ */
body.staff .wrap{max-width:1200px}
.svc{border:0;border-radius:999px;padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:10px;min-height:48px}
.svc i{width:14px;height:14px;border-radius:50%;background:currentColor}
.svc.on{background:var(--ok);color:#fff}
.svc.off{background:rgba(8,24,19,.55);color:#fff;text-shadow:none}
.svc.on{text-shadow:none}
.ptabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.ptabs .tab{flex:0 1 auto;padding:10px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.mc{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.mc.hot{border-color:var(--alert);box-shadow:0 0 0 2px var(--alert)}
.mc .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 6px}
.mc .h b{font-family:var(--f-display);font-size:1.5em}
.mc .who{padding:0 16px 10px;color:var(--muted);font-size:.9em;overflow-wrap:anywhere}
.t{color:var(--muted);font-size:.85em;font-variant-numeric:tabular-nums}
.ev{margin:0 10px 10px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ev.call{background:var(--warn-soft)}
.ev.ord{background:var(--alert-soft)}
.ev .l{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ev ul{margin:0;padding-left:20px}
.ev .nota{background:var(--card);border-radius:10px;padding:8px 10px;font-size:.9em;overflow-wrap:anywhere}
.act{border:0;border-radius:12px;padding:12px;font-weight:700;min-height:48px}
.act.go{background:var(--accent);color:var(--accent-ink)}
.act.ok{background:var(--ok);color:#fff}
.act.pay{background:var(--brand);color:var(--brand-ink)}
.act.no{background:var(--line)}
.act.lnk{background:transparent;color:var(--alert);min-height:44px;padding:6px;font-size:.9em;text-decoration:underline}
.cons{padding:4px 16px 8px;border-top:1px solid var(--line)}
.cons .row{padding:7px 0;font-size:.95em}
.cons small{display:block;color:var(--muted);font-size:.8em}
.cons .cap{font-size:.75em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:10px}
.foot{padding:10px 16px 16px;display:grid;gap:8px}
.ask{background:var(--soft);border-radius:12px;padding:12px;display:grid;gap:8px}
.ask .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.offbox{text-align:center;padding:60px 0;color:var(--muted)}
.offbox b{display:block;font-family:var(--f-display);font-size:1.6em;color:var(--ink);margin-bottom:8px}
.offacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.mbox .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mbox .alta{display:flex;gap:8px;margin-top:14px}.mbox .alta input{flex:1;min-width:0}
.offacts.herr{margin-top:28px;padding-top:18px;border-top:1px solid rgba(0,0,0,.08)}
.offacts .ghost{margin:0;color:var(--ink);text-decoration:none;display:inline-block}
/* registro de jornada */
.jt{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums;margin-bottom:18px}
.jt th,.jt td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.92em;vertical-align:top}
.jt th{background:var(--soft);font-size:.78em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.jt tfoot td{font-weight:700;border-bottom:0}
.jt .obs{color:var(--muted);font-size:.85em}
.jt .falta{color:var(--alert);font-weight:700}
.tscroll{overflow-x:auto}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}
.fbar label{display:grid;gap:4px;font-weight:700;font-size:.85em}
.fbar input,.fbar select{font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink);min-height:48px}
.wk{font-family:var(--f-display);font-size:1.25em;margin:22px 0 8px}
.legal{color:var(--muted);font-size:.85em;margin-top:24px}
@media print{.jt{border-color:#999}.jt th{background:#eee}}
.demo{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:.85em;padding:6px 12px;font-weight:700}
.pago{border-top:1px solid var(--line);padding:4px 0}
.pago summary{display:flex;justify-content:space-between;gap:10px;padding:10px 0;cursor:pointer;font-weight:700}
.pago summary span{font-weight:400}
.pago .mine{margin-top:4px;border:0;padding:0 4px}
.dia{font-family:var(--f-display);font-size:1.05em;margin:18px 0 8px}
.dia::first-letter{text-transform:uppercase}
.quienes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.quienes button{min-height:76px;border:2px solid var(--brand);background:var(--card);color:var(--ink);border-radius:18px;font-weight:800;font-size:1.2em}
.quienes button.yo{background:var(--brand);color:var(--brand-ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:16px}
.mbox{background:var(--bg);color:var(--ink);border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:8px}
.hist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* QR imprimibles */
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px}
.qrc{background:#fff;color:#16241F;border:2px solid #1E4A3D;border-radius:18px;padding:18px;text-align:center;break-inside:avoid}
.qrc .nm{font-family:var(--f-display);font-weight:800;font-size:1.5em;color:#1E4A3D}
.qrc .q{display:flex;justify-content:center;margin:12px 0}
.qrc .ms{font-weight:700;font-size:1.2em}
.qrc .hint{font-size:.8em;color:#56655F}
.qrc .qa{display:flex;gap:8px;justify-content:center;margin-top:12px}
.qrc .qa button{min-height:44px;padding:8px 12px;font-size:.85em}
@media print{body.solo .qrc:not(.imp){display:none}body.solo .qrs{display:block}body.solo .qrc{max-width:320px;margin:0 auto}}
@media print{.noprint,.bg{display:none!important}body{background:#fff}.wrap{padding:0}main.wrap{box-shadow:none;margin:0;border-radius:0;min-height:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY;
const sb = !DEMO && window.supabase ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY) : null;
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("esencia") : null;
const T = "esencia_pedidos", TB = "esencia_bloqueos";
// cada móvil guarda un código propio para que la barra pueda reconocerlo y, si hace falta, bloquearlo
const DISPOSITIVO = (()=>{ let d = ls.get("esencia_dispositivo",""); if (!d){ d = (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)); ls.set("esencia_dispositivo", d); } return d; })();
const demoAll = () => ls.get("esencia_demo", []);
const demoFich = () => ls.get("esencia_demo_fich", []);
const demoTrab = () => ls.get("esencia_demo_trab", null) || CONFIG.TRABAJADORES_PRUEBA;   // camareros en modo prueba (el encargado puede añadir y quitar)
const demoSave = a => { ls.set("esencia_demo", a); bc && bc.postMessage("x"); };
const Store = {
  async add(rec){
    if (sb){ const {data,error} = await sb.from(T).insert(rec).select().single(); if (error) throw error; return data; }
    const row = {...rec, id: Date.now(), created_at: new Date().toISOString(), estado:"nuevo", cerrado:false};
    demoSave([...demoAll(), row]); return row;
  },
  async list(){ // todo lo de las últimas 16 h (abiertas + cerradas hoy)
    const desde = new Date(Date.now()-16*3600e3).toISOString();
    if (sb){ const {data,error} = await sb.from(T).select("*").gte("created_at",desde).order("created_at"); if (error) throw error; return data; }
    return demoAll().filter(r=>r.created_at>=desde);
  },
  async byIds(ids){
    if (!ids.length) return [];
    if (sb){ const {data,error} = await sb.from(T).select("*").in("id",ids); if (error) throw error; return data; }
    return demoAll().filter(r=>ids.includes(r.id));
  },
  async accept(id){
    const patch = {estado:"aceptado", aceptado_at:new Date().toISOString()};
    if (sb){ const {error} = await sb.from(T).update(patch).eq("id",id); if (error) throw error; return; }
    demoSave(demoAll().map(r=>r.id===id?{...r,...patch}:r));
  },
  async closeMesa(mesa){
    const patch = {cerrado:true, cerrado_at:new Date().toISOString(), estado:"aceptado"};
    if (sb){ const {error} = await sb.from(T).update(patch).eq("mesa",mesa).eq("cerrado",false); if (error) throw error; return; }
    demoSave(demoAll().map(r=>r.mesa===mesa&&!r.cerrado?{...r,...patch}:r));
  },
  async cuentaCerrada(m, at){ // lo que se cobró de una mesa en un cierre
    if (sb){ const {data,error} = await sb.from(T).select("*").eq("mesa",m).eq("cerrado_at",at).neq("estado","anulado").order("created_at"); if (error) throw error; return data; }
    return demoAll().filter(r=>r.mesa===m && r.cerrado_at===at && r.estado!=="anulado");
  },
  async cobradas(){ // mesas cobradas en los últimos 7 días
    const desde = new Date(Date.now()-7*864e5).toISOString();
    if (sb){ const {data,error} = await sb.from(T).select("*").eq("cerrado",true).gte("cerrado_at",desde).neq("estado","anulado").order("cerrado_at",{ascending:false}); if (error) throw error; return data; }
    return demoAll().filter(r=>r.cerrado && r.cerrado_at>=desde && r.estado!=="anulado");
  },
  async deMesa(m){ // todo lo abierto de una mesa (todos los clientes)
    if (sb){ const {data,error} = await sb.from(T).select("*").eq("mesa",m).eq("cerrado",false).neq("estado","anulado").order("created_at"); if (error) throw error; return data; }
    return demoAll().filter(r=>r.mesa===m && !r.cerrado && r.estado!=="anulado");
  },
  async masPedidos(){ // lo que más se pide (últimos 60 días)
    const desde = new Date(Date.now()-60*864e5).toISOString();
    let rows;
    if (sb){ const {data,error} = await sb.from(T).select("items").eq("tipo","pedido").gte("created_at",desde).order("created_at",{ascending:false}).limit(1000); if (error) throw error; rows = data; }
    else rows = demoAll().filter(r=>r.tipo==="pedido");
    const c = {}; rows.forEach(r=>(r.items||[]).forEach(i=>{ c[i.n] = (c[i.n]||0) + (Number(i.q)||0); })); return c;
  },
  async bloqueados(){
    if (sb){ const {data,error} = await sb.from(TB).select("*").order("created_at",{ascending:false}); if (error) throw error; return data; }
    return ls.get("esencia_demo_bloq", []);
  },
  async estoyBloqueado(){
    if (sb){ const {data,error} = await sb.from(TB).select("dispositivo").eq("dispositivo",DISPOSITIVO).limit(1); if (error) throw error; return data.length>0; }
    return ls.get("esencia_demo_bloq", []).some(b=>b.dispositivo===DISPOSITIVO);
  },
  async bloquear(r){ // bloquea el móvil y anula lo que tenga pendiente
    const b = {dispositivo:r.dispositivo, cliente:r.cliente||"", mesa:r.mesa};
    const patch = {estado:"anulado"};
    if (sb){ let {error} = await sb.from(TB).upsert(b,{onConflict:"dispositivo"}); if (error) throw error;
             ({error} = await sb.from(T).update(patch).eq("dispositivo",r.dispositivo).eq("cerrado",false).eq("estado","nuevo")); if (error) throw error; return; }
    ls.set("esencia_demo_bloq", [{...b, created_at:new Date().toISOString()}, ...ls.get("esencia_demo_bloq", []).filter(x=>x.dispositivo!==r.dispositivo)]);
    demoSave(demoAll().map(x=>x.dispositivo===r.dispositivo&&!x.cerrado&&x.estado==="nuevo"?{...x,...patch}:x));
  },
  async desbloquear(dispositivo){
    if (sb){ const {error} = await sb.from(TB).delete().eq("dispositivo",dispositivo); if (error) throw error; return; }
    ls.set("esencia_demo_bloq", ls.get("esencia_demo_bloq", []).filter(x=>x.dispositivo!==dispositivo)); bc && bc.postMessage("x");
  },
  /* --- fichajes (registro de jornada). Con Supabase todo pasa por funciones del servidor:
         la hora la pone el servidor y nadie puede editar ni borrar un fichaje --- */
  async trabEntrar(pin){
    if (sb){ const {data,error} = await sb.rpc("esencia_entrar",{p_pin:pin}); if (error) throw error; return data&&data[0] ? {...data[0], pin} : null; }
    const t = demoTrab().find(t=>t.pin===pin); return t ? {...t} : null;
  },
  // entrada por nombre: lista de nombres, primera vez elegir PIN, luego nombre + PIN
  async trabLista(){
    if (sb){ const {data,error} = await sb.rpc("esencia_lista_trabajadores"); if (error) throw error; return data; }
    const pins = ls.get("esencia_demo_pins", {});
    return demoTrab().map(t=>({id:t.id, nombre:t.nombre, tiene_pin:!!(pins[t.id]??t.pin)}));
  },
  async trabPonerPin(id, pin){
    if (sb){ const {error} = await sb.rpc("esencia_poner_pin",{p_id:id, p_pin:pin}); if (error) throw error; return; }
    const pins = ls.get("esencia_demo_pins", {}); pins[id] = pin; ls.set("esencia_demo_pins", pins);
  },
  async trabEntrarNombre(id, pin){
    if (sb){ const {data,error} = await sb.rpc("esencia_entrar_nombre",{p_id:id, p_pin:pin}); if (error) throw error; return data&&data[0] ? {...data[0], pin} : null; }
    const pins = ls.get("esencia_demo_pins", {}), t = demoTrab().find(t=>t.id===id);
    return t && (pins[id]??t.pin) === pin ? {...t, pin} : null;
  },
  async trabBorrarPin(admin, id){
    if (sb){ const {error} = await sb.rpc("esencia_borrar_pin",{p_pin:admin.pin, p_id:id}); if (error) throw error; return; }
    const pins = ls.get("esencia_demo_pins", {}); pins[id] = ""; ls.set("esencia_demo_pins", pins);
  },
  // el encargado añade camareros o los quita de la lista (no se borra su historial de fichajes)
  async trabAlta(admin, nombre){
    if (sb){ const {error} = await sb.rpc("esencia_trab_alta",{p_pin:admin.pin, p_nombre:nombre}); if (error) throw error; return; }
    const l = demoTrab(); if (l.some(t=>t.nombre.toLowerCase()===nombre.toLowerCase())) throw new Error("Ese nombre ya está");
    ls.set("esencia_demo_trab", [...l, {id:Date.now(), nombre, pin:"", admin:false}]);
  },
  async trabBaja(admin, id){
    if (sb){ const {error} = await sb.rpc("esencia_trab_baja",{p_pin:admin.pin, p_id:id}); if (error) throw error; return; }
    ls.set("esencia_demo_trab", demoTrab().filter(t=>t.id!==id || t.id===admin.id));
  },
  async fotosLista(){
    if (sb){ const {data,error} = await sb.from("esencia_fotos").select("producto,updated_at"); if (error) throw error; return data; }
    const d = ls.get("esencia_demo_fotos", {}); return Object.entries(d).map(([producto,f])=>({producto, updated_at:f.t}));
  },
  async fotosDatos(ids){
    if (sb){ const {data,error} = await sb.from("esencia_fotos").select("producto,data,updated_at").in("producto",ids); if (error) throw error; return data; }
    const d = ls.get("esencia_demo_fotos", {}); return ids.filter(k=>d[k]).map(k=>({producto:k, data:d[k].d, updated_at:d[k].t}));
  },
  async ponerFoto(admin, producto, data){
    if (sb){ const {data:t,error} = await sb.rpc("esencia_poner_foto",{p_pin:admin.pin, p_producto:producto, p_data:data}); if (error) throw error; return t; }
    const d = ls.get("esencia_demo_fotos", {}), t = new Date().toISOString(); d[producto] = {t, d:data}; ls.set("esencia_demo_fotos", d); return t;
  },
  async fichar(trab, tipo){
    if (sb){ const {data,error} = await sb.rpc("esencia_fichar",{p_pin:trab.pin, p_tipo:tipo, p_dispositivo:DISPOSITIVO}); if (error) throw error; return data; }
    const f = demoFich(); const ult = f.filter(x=>x.trabajador_id===trab.id).at(-1);
    if ((ult?.tipo||"salida")===tipo) throw new Error("repetido");
    const momento = new Date().toISOString();
    ls.set("esencia_demo_fich", [...f, {id:Date.now(), trabajador_id:trab.id, nombre:trab.nombre, tipo, momento, correccion:false, motivo:null}]); return momento;
  },
  async misFichajes(trab, desde, hasta){
    if (sb){ const {data,error} = await sb.rpc("esencia_mis_fichajes",{p_pin:trab.pin, p_desde:desde, p_hasta:hasta}); if (error) throw error; return data; }
    return demoFich().filter(x=>x.trabajador_id===trab.id && x.momento>=desde && x.momento<hasta);
  },
  async informe(admin, desde, hasta){
    if (sb){ const {data,error} = await sb.rpc("esencia_informe",{p_pin:admin.pin, p_desde:desde, p_hasta:hasta}); if (error) throw error; return data; }
    return demoFich().filter(x=>x.momento>=desde && x.momento<hasta);
  },
  async trabajadores(admin){
    if (sb){ const {data,error} = await sb.rpc("esencia_trabajadores",{p_pin:admin.pin}); if (error) throw error; return data; }
    return demoTrab().map(({id,nombre})=>({id,nombre}));
  },
  async corregir(admin, trabajador_id, tipo, momento, motivo){
    if (sb){ const {error} = await sb.rpc("esencia_corregir",{p_pin:admin.pin, p_trabajador:trabajador_id, p_tipo:tipo, p_momento:momento, p_motivo:motivo}); if (error) throw error; return; }
    const t = demoTrab().find(t=>t.id===trabajador_id);
    ls.set("esencia_demo_fich", [...demoFich(), {id:Date.now(), trabajador_id, nombre:t?.nombre, tipo, momento, correccion:true, motivo, corregido_por:admin.nombre}].sort((a,b)=>a.momento.localeCompare(b.momento)));
  },
  subscribe(cb, cada=15000){
    if (sb){ sb.channel("esencia-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:T}, ()=>cb()).subscribe(); }
    else { bc && bc.addEventListener("message", ()=>cb()); addEventListener("storage", e=>e.key==="esencia_demo"&&cb()); }
    setInterval(cb, cada); // por si se corta la conexión
  }
};

/* ================= CLIENTE ================= */
// la app instalada abre sin mesa: recordamos la de esta visita unas horas
const mesa = (()=>{
  const limpia = v => String(v||"").replace(/[^0-9A-Za-z-]/g,"").slice(0,6);
  let m = limpia(qs.get("mesa"));
  if (!m && !qs.has("panel") && !qs.has("qr") && !qs.has("fichajes") && !qs.has("fotos")){
    const u = ls.get("esencia_mesa", null); if (u && Date.now()-u.t < 4*3600e3) m = limpia(u.m);
  }
  if (m) ls.set("esencia_mesa", {m, t:Date.now()});
  return m;
})();
const MODO_FOTOS = qs.has("fotos");   // el encargado pone fotos a la carta (sin mesa, sin pedir)
const EN_APP = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let avisoInstalar = null;   // Android/Chrome: aviso de instalación guardado para el botón
const KEY = "esencia_cli_"+mesa;
let yo = ls.get(KEY, {nombre:"", ids:[]});  // nombre del cliente + ids de sus peticiones abiertas
if (!yo.nombre) yo.nombre = ls.get("esencia_nombre", "");   // el móvil recuerda el nombre de otras visitas
let bloqueado = false;
let misFilas = [];
let cesta = {};
let vista = yo.nombre ? "inicio" : "nombre";
let catSel = null;   // null = portada de la carta; si no, nombre de la sección
let filasMesa = [];
const guardaYo = () => { ls.set(KEY, yo); if (yo.nombre) ls.set("esencia_nombre", yo.nombre); };
const totalUds = () => Object.values(cesta).reduce((a,b)=>a+b,0);
const totalEur = () => Object.entries(cesta).reduce((a,[id,q])=>a+findItem(id).p*q,0);

function header(){
  return `<header class="top"><div class="wrap">
    <div class="logo">${esc(CONFIG.NOMBRE)}<small>Terraza</small></div>
    <div class="hr"><button class="tsize" id="tsize" aria-label="Cambiar tamaño de letra">A+</button>
      ${mesa?`<div class="mesa"><span>Mesa</span><b>${esc(mesa)}</b></div>`:""}</div></div>
    ${CONFIG.LUGAR?`<div class="wrap lugar"><span>${ICON.pin}${esc(CONFIG.LUGAR)}</span></div>`:""}</header>`;
}
function bindHeader(){ const b=document.getElementById("tsize"); if(b) b.onclick=()=>{ ls.set("esencia_big", document.documentElement.classList.toggle("big")); }; }

async function refrescaMias(){
  if (!mesa) return;
  try { const b = await Store.estoyBloqueado(); if (b!==bloqueado){ bloqueado=b; cliente(); } } catch {}
  try { filasMesa = await Store.deMesa(mesa); } catch {}
  if (!yo.ids.length) { misFilas = []; if (["inicio"].includes(vista)) cliente(); return; }
  try { misFilas = (await Store.byIds(yo.ids)).filter(r=>r.estado!=="anulado"); } catch { return; }
  if (yo.ids.length && !misFilas.length || misFilas.length && misFilas.every(r=>r.cerrado)) {        // la barra ha cobrado y cerrado la mesa
    const mios = misFilas.filter(r=>r.tipo==="pedido");
    if (mios.length){
      const at = mios.map(r=>r.cerrado_at).sort().pop();
      let mesaPeds = mios; try { mesaPeds = (await Store.cuentaCerrada(mesa, at)).filter(r=>r.tipo==="pedido"); } catch {}
      ultimoPago = {at, mesa, mios, mesaPeds};
      ls.set("esencia_pagados", [ultimoPago, ...pagados()].slice(0,30));
      try { navigator.vibrate && navigator.vibrate([150,80,150]); } catch {}
    }
    yo.ids = []; guardaYo(); misFilas = []; ls.set("esencia_mesa", null);
    if (["inicio","enviado","avisado"].includes(vista)) { vista = "cerrada"; }
  }
  if (["inicio","enviado","avisado","cerrada"].includes(vista)) cliente();
}
function llamadaActual(){
  const c = misFilas.filter(r=>r.tipo==="camarero"&&!r.cerrado).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];
  if (!c) return null;
  if (c.estado==="nuevo") return "espera";
  if (c.aceptado_at && Date.now()-new Date(c.aceptado_at) < 5*60e3) return "viene";
  return null;
}
function bloqueEstado(){
  const s = llamadaActual();
  if (s==="espera") return `<div class="status wait" role="status"><span class="dot"></span>Camarero avisado. Esperando a que lo vea…</div>`;
  if (s==="viene")  return `<div class="status go" role="status"><span class="dot"></span>El camarero va hacia tu mesa.</div>`;
  return "";
}
// junta los productos de varios pedidos: [{n, q, p}]
function lineas(peds){
  const c = {}; peds.forEach(r=>(r.items||[]).forEach(i=>{ const k=i.n; c[k]=c[k]||{n:k,q:0,p:Number(i.p)||0}; c[k].q+=Number(i.q)||0; }));
  return Object.values(c);
}
function tablaCuenta(peds, titulo){
  const ls_ = lineas(peds), total = ls_.reduce((a,l)=>a+l.q*l.p,0), uds = ls_.reduce((a,l)=>a+l.q,0);
  const quien = {}; peds.forEach(r=>{ const k=r.cliente||"Sin nombre"; quien[k]=(quien[k]||0)+Number(r.total||0); });
  return `<div class="mine cuenta"><h3>${titulo}</h3>
    ${ls_.map(l=>`<div class="row"><span><b>${l.q}×</b> ${esc(l.n)}<small>${eur(l.p)} c/u</small></span><span>${eur(l.q*l.p)}</span></div>`).join("")}
    <div class="row total"><span>Total (${uds} ${uds===1?"producto":"productos"})</span><span>${eur(total)}</span></div>
    ${Object.keys(quien).length>1?`<div class="quien">${Object.entries(quien).map(([n,t])=>`<span>${esc(n)}: <b>${eur(t)}</b></span>`).join("")}</div>`:""}</div>`;
}
// cuentas pagadas en este móvil: se guardan una semana
let ultimoPago = null;
const pagados = () => ls.get("esencia_pagados", []).filter(p=>Date.now()-new Date(p.at) < 7*864e5);
const fechaHora = iso => new Date(iso).toLocaleString(LOC,{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
function cuentaPagada(p){
  const sumMios = p.mios.reduce((a,r)=>a+Number(r.total||0),0), sumMesa = p.mesaPeds.reduce((a,r)=>a+Number(r.total||0),0);
  return tablaCuenta(p.mios, "Lo que has pedido tú") + (Math.abs(sumMesa-sumMios)>.001 ? tablaCuenta(p.mesaPeds, `Toda la mesa ${esc(p.mesa)}`) : "");
}
function bloquePagados(){
  const ps = pagados(); if (!ps.length) return "";
  return `<div class="mine"><h3>Tus cuentas pagadas (última semana)</h3>${ps.map(p=>`<details class="pago"><summary><span>Mesa ${esc(p.mesa)} · ${esc(fechaHora(p.at))}</span><b>${eur(p.mios.reduce((a,r)=>a+Number(r.total||0),0))}</b></summary>${cuentaPagada(p)}</details>`).join("")}</div>`;
}
function bloqueMios(){
  const mios = misFilas.filter(r=>r.tipo==="pedido"&&!r.cerrado);
  const vistos = new Set(), peds = [...filasMesa, ...mios].filter(r=>r.tipo==="pedido" && !vistos.has(r.id) && vistos.add(r.id));
  if (!peds.length && !mios.length) return "";
  const estado = mios.length ? `<div class="mine"><h3>Tus pedidos</h3>${mios.map(r=>`
    <div class="row"><span>${(r.items||[]).map(i=>`${Number(i.q)||0}× ${esc(i.n)}`).join(", ")}</span>
    <span class="st ${r.estado==="nuevo"?"env":"rec"}">${r.estado==="nuevo"?"Enviado":"Recibido"}</span></div>`).join("")}</div>` : "";
  return estado + tablaCuenta(peds, `La cuenta de la mesa ${esc(mesa)}`);
}

function cliente(){
  document.body.classList.toggle("compact", ["carta","resumen"].includes(vista));
  if (!mesa && !MODO_FOTOS){
    const escaner = "BarcodeDetector" in window && navigator.mediaDevices?.getUserMedia;
    $app.innerHTML = header() + `<main class="wrap pick">
      <p class="hello">${yo.nombre?`Hola, ${esc(yo.nombre)}. `:""}¿En qué mesa estás?</p>
      <p class="sub">Mira el número en el código QR de tu mesa y escríbelo aquí.</p>
      <form id="fm"><input id="nm" inputmode="numeric" placeholder="Nº de mesa" aria-label="Número de mesa" required>
      <button class="cta c" style="margin-top:14px">Continuar</button></form>
      ${escaner?`<button class="ghost" id="scan" style="width:100%">Escanear el QR de la mesa</button>`
               :`<p class="sub" style="margin-top:18px">También puedes abrir la cámara del móvil y apuntar al QR de la mesa.</p>`}
      ${bloqueInstalar()}</main>`;
    document.getElementById("fm").onsubmit = e => { e.preventDefault(); const v=document.getElementById("nm").value.trim(); if(v) location.search="?mesa="+encodeURIComponent(v); };
    if (escaner) document.getElementById("scan").onclick = escanearQR;
    bindHeader(); bindInstalar(); return;
  }
  let h = header() + `<main class="wrap">`, barra = "";
  if (bloqueado){
    $app.innerHTML = h + `<div class="done"><h2>Este móvil no puede pedir desde la app</h2>
      <p class="sub">Si es un error, habla con el camarero y lo arreglamos al momento.</p></div></main>`;
    bindHeader(); return;
  }
  if (vista==="nombre"){
    h += `<div class="pick"><p class="hello">¡Hola! ¿Cómo te llamas?</p>
      <p class="sub">Solo para que el camarero sepa a quién llevarle cada cosa. No hace falta registrarse.</p>
      <form id="fn"><input id="nom" maxlength="30" autocomplete="given-name" placeholder="Tu nombre" aria-label="Tu nombre" value="${esc(yo.nombre)}" required>
      <button class="cta c" style="margin-top:14px">Continuar</button></form></div>`;
  }
  if (vista==="inicio"){
    const s = llamadaActual();
    h += `<p class="hello">Hola, ${esc(yo.nombre)}. ¿Qué necesitas?</p>
      <p class="sub">Toca un botón grande.</p>
      <div class="big-btns">
        <button class="bb call" id="call" ${s==="espera"?"disabled":""}>${ICON.bell}<span><strong>Llamar al camarero</strong><em>${s==="espera"?"Ya le hemos avisado":"Vendrá a tu mesa"}</em></span></button>
        <button class="bb menu" id="carta">${ICON.menu}<span><strong>Ver la carta y pedir</strong><em>Bebidas y comidas</em></span></button>
      </div>${bloqueEstado()}${bloqueMios()}

async function escanearQR(){
  let stream;
  const caja = document.createElement("div"); caja.className = "scan";
  caja.innerHTML = `<video playsinline muted></video><p>Apunta al código QR de tu mesa</p><button class="ghost" id="scanNo">Cancelar</button>`;
  document.body.appendChild(caja);
  const cerrar = ()=>{ stream && stream.getTracks().forEach(t=>t.stop()); caja.remove(); };
  caja.querySelector("#scanNo").onclick = cerrar;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v = caja.querySelector("video"); v.srcObject = stream; await v.play();
    const det = new BarcodeDetector({formats:["qr_code"]});
    const mira = async ()=>{
      if (!caja.isConnected) return;
      try { const r = await det.detect(v);
        for (const c of r){ let m = null;
          try { m = new URL(c.rawValue, location.href).searchParams.get("mesa"); } catch {}
          if (!m && /^[0-9A-Za-z-]{1,6}$/.test(c.rawValue)) m = c.rawValue;
          if (m){ cerrar(); location.search = "?mesa=" + encodeURIComponent(m); return; } }
      } catch {}
      setTimeout(mira, 300);
    };
    mira();
  } catch { cerrar(); toast("No se ha podido abrir la cámara. Escribe el número de la mesa."); }
}

function sonar(tipo){
  if (!enServicio) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const notas = tipo==="camarero" ? [[660,0],[880,.22]] : [[988,0],[988,.16],[1318,.32]];
    notas.forEach(([f,t])=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="triangle"; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      const s=audioCtx.currentTime+t; g.gain.setValueAtTime(.35,s); g.gain.exponentialRampToValueAtTime(.001,s+.2); o.start(s); o.stop(s+.21); });
    navigator.vibrate && navigator.vibrate(tipo==="camarero"?[200,100,200]:[120,80,120,80,120]);
  } catch {}
}

const PUSH_OK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && location.protocol === "https:";

const b64u = s => { const p = "=".repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(r, c=>c.charCodeAt(0)); };
async function activarAvisos(pedir){
  if (!PUSH_OK || !sb || !trab || !CONFIG.VAPID_PUBLICA) return false;
  try {
    if (Notification.permission === "default" && pedir) await Notification.requestPermission();
    if (Notification.permission !== "granted") return false;
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(CONFIG.VAPID_PUBLICA)});
    const j = sub.toJSON();
    const {error} = await sb.rpc("esencia_push_guardar", {p_pin:trab.pin, p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth});
    return !error;
  } catch { return false; }
}

  if (!sb || !CONFIG.VAPID_PUBLICA) return "";

    <p>Para recibirlos con el móvil bloqueado, permite las notificaciones de esta app en los ajustes del móvil.</p></div></div>`;

async function pintar(){
  const cuerpo = document.getElementById("cuerpo"); if (!cuerpo) return;
  if (pestana==="fichajes") return pintaMisFichajes(cuerpo);
  if (!enServicio){
    cuerpo.innerHTML = `<div class="offbox"><b>Fuera de servicio</b>No recibes avisos ni sonidos.<br>Pulsa “Fuera de servicio” arriba para fichar la entrada y empezar.
      <div class="offacts"><button class="ghost" data-p="fichajes">Ver mis fichajes</button>
      ${trab.admin?`<a class="ghost" href="${location.pathname}?fichajes">Registro de jornada</a><a class="ghost" href="${location.pathname}?qr">QR de las mesas</a><a class="ghost" href="${location.pathname}?fotos">Fotos de la carta</a><button class="ghost" id="pinsOlv">Camareros</button>`:""}
      <button class="ghost" id="salirTrab">Cambiar de trabajador</button></div></div>`;
    cuerpo.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pestana=b.dataset.p;pintar()});
    document.getElementById("salirTrab").onclick = ()=>{ trab=null; ls.set("esencia_trab",null); panel(); };
    const po = document.getElementById("pinsOlv"); if (po) po.onclick = pantallaPins;
    return;
  }
  try { filas = (await Store.list()).filter(r=>r.estado!=="anulado"); bloqs = await Store.bloqueados(); } catch { toast("Sin conexión con el servidor"); return; }
  // sonido solo para lo nuevo que no habíamos visto
  const nuevos = filas.filter(r=>r.estado==="nuevo"&&!r.cerrado);
  if (vistos){ const n = nuevos.filter(r=>!vistos.has(r.id));
    if (n.some(r=>r.tipo==="camarero")) sonar("camarero"); else if (n.length) sonar("pedido"); }
  vistos = new Set(nuevos.map(r=>r.id));
  document.title = nuevos.length ? `(${nuevos.length}) ${CONFIG.NOMBRE}` : CONFIG.NOMBRE;

  const abiertas = {};
  filas.filter(r=>!r.cerrado).forEach(r=>{ (abiertas[r.mesa] = abiertas[r.mesa]||[]).push(r); });
  const mesasAb = Object.keys(abiertas).sort((a,b)=>{
    const ha = abiertas[a].some(r=>r.estado==="nuevo"), hb = abiertas[b].some(r=>r.estado==="nuevo");
    return ha!==hb ? (ha?-1:1) : a.localeCompare(b,"es",{numeric:true});
  });

  let h = bloqueAvisos() + `<div class="ptabs">
    <button class="tab" data-p="abiertas" aria-selected="${pestana==="abiertas"}">Mesas abiertas (${mesasAb.length})</button>
    <button class="tab" data-p="cerradas" aria-selected="${pestana==="cerradas"}">Cobradas (7 días)</button>
    <button class="tab" data-p="bloqueados" aria-selected="${pestana==="bloqueados"}">Móviles bloqueados (${bloqs.length})</button>
    <button class="tab" data-p="fichajes">Mis fichajes</button></div>`;

  if (pestana==="abiertas"){
    h += mesasAb.length ? `<div class="grid">${mesasAb.map(m=>tarjetaMesa(m, abiertas[m])).join("")}</div>`
                        : `<p class="empty">No hay mesas con pedidos. Cuando un cliente escanee el QR y pida, aparecerá aquí.</p>`;
  } else if (pestana==="bloqueados"){
    h += bloqs.length ? `<div class="grid">${bloqs.map(b=>`<div class="hist"><span><b>${esc(b.cliente||"Sin nombre")}</b><br><span class="t">Mesa ${esc(b.mesa||"?")} · bloqueado ${b.created_at?hace(b.created_at):""}</span></span>
        <button class="act no" data-desbloq="${esc(b.dispositivo)}">Desbloquear</button></div>`).join("")}</div>`
      : `<p class="empty">No hay ningún móvil bloqueado. Si alguien pide o llama de broma, toca “Bloquear este móvil” en su aviso.</p>`;
  } else {
    let cob = []; try { cob = await Store.cobradas(); } catch { toast("Sin conexión con el servidor"); }
    const porCierre = {}; cob.forEach(r=>{ const k=r.mesa+"|"+r.cerrado_at; (porCierre[k]=porCierre[k]||[]).push(r); });
    const lista = Object.entries(porCierre).sort((x,y)=>y[0].split("|")[1].localeCompare(x[0].split("|")[1]));
    const dia = iso => new Date(iso).toLocaleDateString(LOC,{weekday:"long",day:"numeric",month:"long"});
    let ultimo = "", totDia = {};
    lista.forEach(([k,rs])=>{ const d=dia(rs[0].cerrado_at); totDia[d]=(totDia[d]||0)+rs.filter(r=>r.tipo==="pedido").reduce((a,r)=>a+Number(r.total||0),0); });
    h += lista.length ? lista.map(([k,rs])=>{
        const d = dia(rs[0].cerrado_at), peds = rs.filter(r=>r.tipo==="pedido"), tot = peds.reduce((a,r)=>a+Number(r.total||0),0);
        const cab = d!==ultimo ? `<h3 class="dia">${esc(d)} · ${eur(totDia[d])}</h3>` : ""; ultimo = d;
        return cab + `<details class="hist pago" data-k="${esc(k)}"><summary><span><b>Mesa ${esc(rs[0].mesa)}</b> · cobrada a las ${hora(rs[0].cerrado_at)}${(n=>n.length?`<br><small class="t">${n.map(esc).join(" · ")}</small>`:"")([...new Set(rs.map(r=>r.cliente).filter(Boolean))])}</span><b style="font-variant-numeric:tabular-nums">${eur(tot)}</b></summary>${peds.length?tablaCuenta(peds, "Lo cobrado"):"<p class='t'>Solo llamadas, sin pedidos.</p>"}</details>`;
      }).join("") : `<p class="empty">No se ha cobrado ninguna mesa en los últimos 7 días.</p>`;
  }
  // también de servicio: las herramientas del encargado y cambiar de trabajador, abajo del todo
  h += `<div class="offacts herr">${trab.admin?`<a class="ghost" href="${location.pathname}?fichajes">Registro de jornada</a><a class="ghost" href="${location.pathname}?qr">QR de las mesas</a><a class="ghost" href="${location.pathname}?fotos">Fotos de la carta</a><button class="ghost" id="pinsOlv">Camareros</button>`:""}
    <button class="ghost" id="salirTrab">Cambiar de trabajador</button></div>`;
  const abiertos = new Set([...cuerpo.querySelectorAll("details[open][data-k]")].map(d=>d.dataset.k));
  cuerpo.innerHTML = h;
  cuerpo.querySelectorAll("details[data-k]").forEach(d=>{ if (abiertos.has(d.dataset.k)) d.open = true; });

  cuerpo.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pestana=b.dataset.p;pintar()});
  document.getElementById("salirTrab").onclick = ()=>{ trab=null; ls.set("esencia_trab",null); panel(); };
  { const po = document.getElementById("pinsOlv"); if (po) po.onclick = pantallaPins; }
  const aa = document.getElementById("actAvisos");
  if (aa) aa.onclick = async ()=>{ aa.disabled = true; const ok = await activarAvisos(true);
    toast(ok ? "Avisos activados. Te llegarán aunque el móvil esté bloqueado." : "No se han podido activar los avisos."); pintar(); };
  cuerpo.querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{ b.disabled=true;
    const id = isNaN(b.dataset.acc)?b.dataset.acc:Number(b.dataset.acc);
    try{ await Store.accept(id); pintar(); }catch{ b.disabled=false; toast("No se ha guardado. Prueba otra vez."); } });
  cuerpo.querySelectorAll("[data-bloq]").forEach(b=>b.onclick=()=>{ bloqueando=b.dataset.bloq; pintar(); });
  cuerpo.querySelectorAll("[data-nobloq]").forEach(b=>b.onclick=()=>{ bloqueando=null; pintar(); });
  cuerpo.querySelectorAll("[data-sibloq]").forEach(b=>b.onclick=async()=>{ b.disabled=true;
    const r = filas.find(x=>String(x.id)===b.dataset.sibloq);
    try{ await Store.bloquear(r); bloqueando=null; toast("Móvil bloqueado. Ya no podrá pedir ni llamar desde la app."); pintar(); }
    catch{ b.disabled=false; toast("No se ha podido bloquear. Prueba otra vez."); } });
  cuerpo.querySelectorAll("[data-desbloq]").forEach(b=>b.onclick=async()=>{ b.disabled=true;
    try{ await Store.desbloquear(b.dataset.desbloq); toast("Móvil desbloqueado"); pintar(); }
    catch{ b.disabled=false; toast("No se ha podido desbloquear. Prueba otra vez."); } });
  cuerpo.querySelectorAll("[data-cobrar]").forEach(b=>b.onclick=()=>{ cobrando=b.dataset.cobrar; pintar(); });
  cuerpo.querySelectorAll("[data-nocobrar]").forEach(b=>b.onclick=()=>{ cobrando=null; pintar(); });
  cuerpo.querySelectorAll("[data-cerrar]").forEach(b=>b.onclick=async()=>{ b.disabled=true;
    try{ await Store.closeMesa(b.dataset.cerrar); cobrando=null; toast(`Mesa ${b.dataset.cerrar} cobrada y cerrada`); pintar(); }
    catch{ b.disabled=false; toast("No se ha podido cerrar. Prueba otra vez."); } });
}

function botonBloq(r){
  if (!r.dispositivo) return "";
  if (String(bloqueando)===String(r.id)) return `<div class="ask"><b>¿Bloquear el móvil de ${esc(r.cliente||"este cliente")}? Se anulará este aviso y no podrá pedir ni llamar más desde la app.</b>
    <div class="two"><button class="act pay" data-sibloq="${esc(r.id)}">Sí, bloquear</button><button class="act no" data-nobloq>No</button></div></div>`;
  return `<button class="act lnk" data-bloq="${esc(r.id)}">Es una broma: bloquear este móvil</button>`;
}
function tarjetaMesa(m, rs){
  const pend = rs.filter(r=>r.estado==="nuevo");
  const peds = rs.filter(r=>r.tipo==="pedido");
  const nombres = [...new Set(rs.map(r=>r.cliente).filter(Boolean))];
  const total = peds.reduce((a,r)=>a+Number(r.total||0),0);
  const cons = {};
  peds.forEach(r=>(r.items||[]).forEach(i=>{ const k=i.n; cons[k]=cons[k]||{q:0,p:Number(i.p)||0}; cons[k].q+=Number(i.q)||0; }));
  const desde = rs[0]?.created_at;
  return `<article class="mc ${pend.length?"hot":""}">
    <div class="h"><b>Mesa ${esc(m)}</b><span class="t">Abierta ${desde?hora(desde):""}</span></div>
    ${nombres.length?`<div class="who">${nombres.map(esc).join(" · ")}</div>`:""}
    ${pend.map(r=> r.tipo==="camarero"
      ? `<div class="ev call"><div class="l"><span>${esc(r.cliente||"Un cliente")} llama al camarero</span><span class="t">${hace(r.created_at)}</span></div>
         <button class="act go" data-acc="${esc(r.id)}">Voy para allá</button>${botonBloq(r)}</div>`
      : `<div class="ev ord"><div class="l"><span>Pedido nuevo · ${esc(r.cliente||"")}</span><span class="t">${hace(r.created_at)}</span></div>
         <ul>${(r.items||[]).map(i=>`<li><b>${Number(i.q)||0}×</b> ${esc(i.n)}</li>`).join("")}</ul>
         ${r.nota?`<div class="nota">${esc(r.nota)}</div>`:""}
         <button class="act ok" data-acc="${esc(r.id)}">Recibido</button>${botonBloq(r)}</div>`).join("")}
    ${Object.keys(cons).length?`<div class="cons"><div class="cap">Consumo de la mesa</div>
      ${Object.entries(cons).map(([n,c])=>`<div class="row"><span><b>${c.q}×</b> ${esc(n)}<small>${eur(c.p)} c/u</small></span><span>${eur(c.q*c.p)}</span></div>`).join("")}
      <div class="row total"><span>Total (${Object.values(cons).reduce((a,c)=>a+c.q,0)} prod.)</span><span>${eur(total)}</span></div>
      ${(()=>{ const q={}; peds.forEach(r=>{ const k=r.cliente||"Sin nombre"; q[k]=(q[k]||0)+Number(r.total||0); });
        return Object.keys(q).length>1?`<div class="quien">${Object.entries(q).map(([n,t])=>`<span>${esc(n)}: <b>${eur(t)}</b></span>`).join("")}</div>`:""; })()}</div>`:""}
    <div class="foot">${cobrando===m
      ? `<div class="ask"><b>¿Ya está cobrada la mesa ${esc(m)}${total?` (${eur(total)})`:""}?</b>
         <div class="two"><button class="act pay" data-cerrar="${esc(m)}">Sí, cerrar mesa</button><button class="act no" data-nocobrar>No</button></div></div>`
      : `<button class="act pay" data-cobrar="${esc(m)}">Cobrar y cerrar mesa</button>`}</div>
  </article>`;
}

/* ================= REGISTRO DE JORNADA (fichajes) ================= */
const TZ = "Europe/Madrid";
const fHora = iso => new Date(iso).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",timeZone:TZ});
const fDia = iso => new Date(iso).toLocaleDateString(LOC,{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",timeZone:TZ});
const dur = ms => { const m = Math.round(ms/60000); return `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")} min`; };
const mesActual = () => new Date().toLocaleDateString("sv-SE",{timeZone:TZ}).slice(0,7);
const rangoMes = ym => { const [y,m] = ym.split("-").map(Number); return [new Date(y,m-1,1).toISOString(), new Date(y,m,1).toISOString()]; };
const obsDe = f => f && f.correccion ? `Corregido${f.corregido_por?" por "+f.corregido_por:""}: ${f.motivo||""}` : "";

// junta cada entrada con su salida (de un mismo trabajador)
function jornadas(rows){
  const out = []; let abierta = null;
  [...rows].sort((a,b)=>a.momento.localeCompare(b.momento)).forEach(f=>{
    if (f.tipo==="entrada"){ if (abierta) out.push({e:abierta, s:null}); abierta = f; }
    else { out.push({e:abierta, s:f}); abierta = null; }
  });
  if (abierta) out.push({e:abierta, s:null, curso: Date.now()-new Date(abierta.momento) < 16*3600e3});
  return out.map(j=>({...j, ms: j.e&&j.s ? new Date(j.s.momento)-new Date(j.e.momento) : 0}));
}
function tablaJornada(rows){
  const js = jornadas(rows);
  if (!js.length) return `<p class="empty" style="padding:16px 0">Sin fichajes en este periodo.</p>`;
  const total = js.reduce((a,j)=>a+j.ms,0);
  return `<div class="tscroll"><table class="jt"><thead><tr><th>Día</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Observaciones</th></tr></thead><tbody>
    ${js.map(j=>`<tr><td>${fDia((j.e||j.s).momento)}</td>
      <td>${j.e?fHora(j.e.momento):`<span class="falta">Falta</span>`}</td>
      <td>${j.s?fHora(j.s.momento):(j.curso?"En curso":`<span class="falta">Falta</span>`)}</td>
      <td>${j.ms?dur(j.ms):"—"}</td><td class="obs">${esc([obsDe(j.e),obsDe(j.s)].filter(Boolean).join(" · "))}</td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="3">Total</td><td>${dur(total)}</td><td></td></tr></tfoot></table></div>`;
}

function descargaCsv(){
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const lineas = [["Trabajador","Día","Entrada","Salida","Horas","Observaciones"].map(q).join(";")];
  infPorTrab().forEach(w=>jornadas(w.rs).forEach(j=>lineas.push([w.nombre, new Date((j.e||j.s).momento).toLocaleDateString("es-ES",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",timeZone:TZ}), j.e?fHora(j.e.momento):"FALTA",
    j.s?fHora(j.s.momento):(j.curso?"En curso":"FALTA"), j.ms?(j.ms/3600e3).toFixed(2).replace(".",","):"", [obsDe(j.e),obsDe(j.s)].filter(Boolean).join(" · ")].map(q).join(";"))));
  const blob = new Blob(["﻿"+lineas.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `registro-jornada-${infMes}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

// Solo el encargado. Están dentro de la app de camareros por si un QR se estropea:
// se puede descargar o imprimir el de una mesa, o todos.
const QR_HINT = ["Escanea con la cámara del móvil", "Llama al camarero o pide desde aquí"];
function qrs(){
  document.body.classList.add("staff");
  if (!trab) return pantallaPin("QR de las mesas", qrs);
  if (!trab.admin){
    $app.innerHTML = `<main class="wrap"><p class="hello">Solo el encargado puede sacar los QR.</p><a class="ghost" href="${location.pathname}?panel" style="display:inline-block;color:var(--ink)">Ir al panel</a></main>`;
    return;
  }
  const base = new URL("./", document.baseURI).href;   // la página de clientes, también desde /camareros/
  $app.innerHTML = `<header class="top noprint"><div class="wrap"><div class="logo">${esc(CONFIG.NOMBRE)}<small>QR de las mesas</small></div>
     <a class="svc off" href="${location.pathname}?panel" style="text-decoration:none">Volver al panel</a></div></header>
    <main class="wrap"><div class="noprint">
    <p class="sub">Si un QR se estropea, descarga o imprime el de esa mesa. Para hacerlos todos de nuevo, “Imprimir todos”.</p>
    <button class="act pay" id="qrTodos">Imprimir todos</button></div>
    <div class="qrs">${Array.from({length:CONFIG.MESAS},(_,i)=>`<div class="qrc" id="qc${i+1}"><div class="nm">${esc(CONFIG.NOMBRE)}</div>
      <div class="q" id="q${i+1}"></div><div class="ms">Mesa ${i+1}</div><div class="hint">${QR_HINT.join("<br>")}</div>
      <div class="qa noprint"><button class="act pay" data-qd="${i+1}">Descargar</button><button class="act no" data-qp="${i+1}">Imprimir</button></div></div>`).join("")}</div></main>`;
  for (let i=1;i<=CONFIG.MESAS;i++) if (window.QRCode) new QRCode(document.getElementById("q"+i), {text: base+"?mesa="+i, width:170, height:170, correctLevel: QRCode.CorrectLevel.M});
  document.getElementById("qrTodos").onclick = ()=>print();
  document.querySelectorAll("[data-qp]").forEach(b=>b.onclick=()=>{
    const c = document.getElementById("qc"+b.dataset.qp);
    document.body.classList.add("solo"); c.classList.add("imp");
    addEventListener("afterprint", ()=>{ document.body.classList.remove("solo"); c.classList.remove("imp"); }, {once:true});
    print();
  });
  document.querySelectorAll("[data-qd]").forEach(b=>b.onclick=()=>descargaQR(+b.dataset.qd));
}

function descargaQR(n){
  const src = document.querySelector(`#q${n} canvas`) || document.querySelector(`#q${n} img`);
  if (!src) return toast("No se ha podido crear el QR. Revisa la conexión.");
  const W=600, H=820, c=document.createElement("canvas"), g=c.getContext("2d"); c.width=W; c.height=H;
  g.fillStyle="#fff"; g.fillRect(0,0,W,H);
  g.strokeStyle="#1E4A3D"; g.lineWidth=8; g.beginPath(); g.roundRect(14,14,W-28,H-28,40); g.stroke();
  g.textAlign="center"; g.fillStyle="#1E4A3D"; g.font="800 52px "+getComputedStyle(document.body).fontFamily;
  g.fillText(CONFIG.NOMBRE, W/2, 105);
  g.imageSmoothingEnabled=false; g.drawImage(src, 100, 150, 400, 400);
  g.fillStyle="#16241F"; g.font="700 54px sans-serif"; g.fillText(tr("Mesa "+n), W/2, 640);
  g.fillStyle="#56655F"; g.font="28px sans-serif"; QR_HINT.forEach((t,k)=>g.fillText(tr(t), W/2, 705+k*40));
  c.toBlob(bl=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(bl); a.download=`QR-mesa-${n}.png`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); }, "image/png");
}

  [/^La cuenta de la mesa (.+)$/, m=>`El compte de la taula ${m[1]}`],
  [/^Total \((\d+) productos?\)$/, m=>`Total (${m[1]} ${m[1]==="1"?"producte":"productes"})`],
  [/^Total \((\d+) prod\.\)$/, m=>`Total (${m[1]} prod.)`],
  [/^(.+) c\/u$/, m=>`${m[1]} c/u`],
  [/^hace (\d+) min$/, m=>`fa ${m[1]} min`],
  [/^Entrada fichada a las (.+)\. Te avisaremos con sonido\.$/, m=>`Entrada fitxada a les ${m[1]}. T'avisarem amb so.`],
  [/^Salida fichada a las (.+)\. Buen descanso\.$/, m=>`Sortida fitxada a les ${m[1]}. Bon descans.`],
  [/^Mesa (.+) cobrada y cerrada$/, m=>`Taula ${m[1]} cobrada i tancada`],
  [/^(.+) llama al camarero$/, m=>`${tr(m[1])} crida el cambrer`],

  [/^¿Bloquear el móvil de (.+)\? Se anulará este aviso y no podrá pedir ni llamar más desde la app\.$/, m=>`Bloquejar el mòbil de ${tr(m[1])}? S'anul·larà aquest avís i no podrà demanar ni cridar més des de l'app.`],
  [/^¿Ya está cobrada la mesa (.+?)( \(.+\))?\?$/, m=>`Ja està cobrada la taula ${m[1]}${m[2]||""}?`],
  [/^bloqueado ?(.*)$/, m=>`bloquejat ${tr(m[1])}`],
  [/^cobrada a las (.+)$/, m=>`cobrada a les ${m[1]}`],
  [/^Mis fichajes, (.+)$/, m=>`Els meus fitxatges, ${m[1]}`],
  [/^Jornadas de (.+)$/, m=>`Jornades de ${m[1]}`],
  [/^Corregido(?: por (.+?))?: (.*)$/, m=>`Corregit${m[1]?` per ${m[1]}`:""}: ${m[2]}`],
  [/^Añadir (.+)$/, m=>`Afegir ${tr(m[1])}`],
  [/^Quitar uno de (.+)$/, m=>`Treure'n un de ${tr(m[1])}`],
  [/^· (.+)$/, m=>{ const r = tr(m[1]); return r!==m[1] ? `· ${r}` : null; }],
  [/^Mesa (\S+)$/, m=>`Taula ${m[1]}`],

];
const DIC = {zh:[ZH, ZH_RE], ca:[CA, CA_RE]}[LANG];
function tr(s){
  if (!DIC || !s) return s;
  if (DIC[0][s]) return DIC[0][s];
  for (const [re, f] of DIC[1]){ const m = s.match(re); if (m){ const r = f(m); if (r) return r; } }
  if (s.includes(" · ")){ const p = s.split(" · "), t = p.map(tr); if (t.some((x,k)=>x!==p[k])) return t.join(" · "); }
  if (/^\d+× .+, \d+× /.test(s)) return s.split(", ").map(tr).join("，");
  return s;
}
function traduce(root){
  if (!DIC || !root) return;
  if (root.nodeType === 3){ const v = root.nodeValue, t = v.trim(); if (!t) return;
    const r = tr(t); if (r !== t) root.nodeValue = v.replace(t, r); return; }
  if (root.nodeType !== 1 || root.closest?.("script,style,textarea")) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; const ns = [];
  while ((n = w.nextNode())) ns.push(n);
  ns.forEach(x=>{ if (!x.parentElement?.closest("script,style,textarea")) traduce(x); });
  [root, ...root.querySelectorAll("[placeholder],[aria-label],[title]")].forEach(el=>["placeholder","aria-label","title"].forEach(a=>{
    const v = el.getAttribute?.(a); if (v){ const r = tr(v); if (r !== v) el.setAttribute(a, r); } }));
}
const BANDERA = {
  es:`<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#C60B1E"/><rect y="5" width="30" height="10" fill="#FFC400"/></svg>`,

  zh:`<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#DE2910"/><g fill="#FFDE00"><path d="M5 2.2l1.2 3.5h3.7l-3 2.2 1.1 3.5L5 9.2l-3 2.2 1.1-3.5-3-2.2h3.7z"/><circle cx="10" cy="2" r=".9"/><circle cx="12" cy="4" r=".9"/><circle cx="12" cy="7" r=".9"/><circle cx="10" cy="9" r=".9"/></g></svg>`
};
function ponBanderas(){
  document.querySelectorAll("header.top .logo").forEach(logo=>{
    if (logo.parentElement.querySelector(".idiomas")) return;
    const d = document.createElement("div"); d.className = "idiomas noprint";
    d.innerHTML = [["es","Español"],["ca","Català"],["zh","中文"]].map(([k,t])=>`<button data-lang="${k}" aria-pressed="${k===LANG}" aria-label="${t}" title="${t}">${BANDERA[k]}</button>`).join("");
    d.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ if (b.dataset.lang===LANG) return; ls.set("esencia_lang", b.dataset.lang); location.reload(); });
    logo.after(d);
  });
}
if (LANG !== "es") document.documentElement.lang = LANG === "zh" ? "zh-CN" : "ca";
new MutationObserver(ms=>{ ponBanderas(); if (DIC) ms.forEach(m=>{
  if (m.type==="characterData") traduce(m.target); else m.addedNodes.forEach(traduce); }); })
  .observe(document.body, {childList:true, subtree:true, characterData:true});

  document.body.prepend(pv);
  pv.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ location.hash=b.dataset.v; location.reload(); });
}
if (qs.has("panel")) { if (trab) entrarPanel(); else panel(); Store.subscribe(()=>{ if (trab && pestana!=="fichajes") pintar(); }, 10000); }
